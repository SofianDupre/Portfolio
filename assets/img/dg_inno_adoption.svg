<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img"><rect width="1000" height="540" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Innovateur ou adopteur : la place de l’utilisateur</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le cas du kitesurf pose la question autrement : et si l’innovation venait de celui qui utilise le produit ?</text><rect x="160" y="112" width="672" height="336" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><line x1="496" y1="112" x2="496" y2="448" stroke="#DCE5EF" stroke-width="1.5"/><line x1="160" y1="280" x2="832" y2="280" stroke="#DCE5EF" stroke-width="1.5"/><text x="496" y="480" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Degré d’appropriation</text><text x="114" y="280" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle" transform="rotate(-90 114 280)">Initiative de l’utilisateur</text><text x="328.0" y="182.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Détournement d’usage</text><text x="328.0" y="208.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">L’utilisateur emploie le produit autrement</text><text x="328.0" y="225.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">que prévu, et crée de fait une nouvelle</text><text x="328.0" y="242.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">fonction.</text><text x="664.0" y="182.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Innovation d’utilisateur</text><text x="664.0" y="208.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">La communauté conçoit elle-même la solution,</text><text x="664.0" y="225.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">plus vite que le fabricant.</text><text x="664.0" y="350.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Adoption précoce</text><text x="664.0" y="376.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">L’utilisateur adopte tôt, teste, fait</text><text x="664.0" y="393.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">remonter — mais ne conçoit pas.</text><text x="328.0" y="350.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Usage conforme</text><text x="328.0" y="376.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le produit est employé tel qu’il a été pensé</text><text x="328.0" y="393.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">: aucune innovation n’en sort.</text><text x="30" y="518" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">La conclusion du cas : le détournement est une solution pertinente à court terme, parce qu’attendre une réponse industrielle coûte plus cher</text><text x="30" y="534" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">que bricoler soi-même.</text></svg>