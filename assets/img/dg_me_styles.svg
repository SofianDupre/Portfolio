<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 315" width="1000" height="315" role="img"><rect width="1000" height="315" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Les quatre styles de management</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Aucun n’est meilleur qu’un autre : chacun correspond à un niveau de maturité — compétence et motivation — du collaborateur.</text><rect x="30.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="124" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="141.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Directif</text><text x="141.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le manager donne des consignes</text><text x="141.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">précises et contrôle</text><text x="141.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">fortement. Adapté à un</text><text x="141.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">collaborateur débutant, ou à</text><text x="141.5" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">une tâche urgente.</text><rect x="269.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="364" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="380.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Persuasif</text><text x="380.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le manager explique, rassure</text><text x="380.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">et motive. Il contrôle encore,</text><text x="380.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">mais avec pédagogie. Pour un</text><text x="380.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">collaborateur en progression,</text><text x="380.5" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">pas encore autonome.</text><rect x="508.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="602" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="619.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Participatif</text><text x="619.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le manager écoute, implique et</text><text x="619.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">décide avec l’équipe. Pour un</text><text x="619.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">collaborateur compétent, mais</text><text x="619.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">qui manque de confiance.</text><rect x="747.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="842" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="858.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Délégatif</text><text x="858.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le manager fait confiance,</text><text x="858.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">responsabilise et contrôle a</text><text x="858.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">posteriori. Pour un</text><text x="858.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">collaborateur expérimenté et</text><text x="858.5" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">autonome.</text><text x="30" y="293" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le management situationnel, développé par Paul Hersey et Ken Blanchard dans les années 1970 : il n’existe pas de style unique et universel.</text><text x="30" y="309" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un bon manager n’a pas UN style, il sait passer de l’un à l’autre selon la maturité de la personne et selon la situation — urgence,</text><text x="30" y="325" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">nouveauté, complexité, autonomie requise.</text></svg>