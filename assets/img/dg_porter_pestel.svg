<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" width="1000" height="335" role="img"><rect width="1000" height="335" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Le diagnostic stratégique : deux outils, deux échelles</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le PESTEL balaie le macro-environnement, les cinq forces de Porter analysent l’intensité concurrentielle du secteur.</text><rect x="30.0" y="108" width="175.2" height="181" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="101" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="117.6" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Menace des nouveaux</text><text x="117.6" y="176" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">entrants</text><text x="117.6" y="204" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Hauteur des barrières à</text><text x="117.6" y="221" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’entrée : capital</text><text x="117.6" y="238" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">requis, accès à la</text><text x="117.6" y="255" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">distribution,</text><text x="117.6" y="272" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">réputation.</text><rect x="221.2" y="108" width="175.2" height="181" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="292" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="308.79999999999995" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Pouvoir des clients</text><text x="308.79999999999995" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Concentration, coût de</text><text x="308.79999999999995" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">changement, sensibilité</text><text x="308.79999999999995" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">au prix.</text><rect x="412.4" y="108" width="175.2" height="181" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Produits de</text><text x="500.0" y="176" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">substitution</text><text x="500.0" y="204" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Une autre façon de</text><text x="500.0" y="221" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">satisfaire le même</text><text x="500.0" y="238" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">besoin.</text><rect x="603.5999999999999" y="108" width="175.2" height="181" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="674" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="691.1999999999999" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Pouvoir des</text><text x="691.1999999999999" y="176" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">fournisseurs</text><text x="691.1999999999999" y="204" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Rareté de la ressource,</text><text x="691.1999999999999" y="221" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">dépendance, intégration</text><text x="691.1999999999999" y="238" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">aval possible.</text><rect x="794.8" y="108" width="175.2" height="181" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="865" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="882.4" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Rivalité entre</text><text x="882.4" y="176" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">concurrents</text><text x="882.4" y="204" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Nombre d’acteurs,</text><text x="882.4" y="221" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">croissance du marché,</text><text x="882.4" y="238" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">barrières à la sortie.</text><text x="30" y="313" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">En amont : le PESTEL — politique, économique, socioculturel, technologique, écologique, légal. En aval : la chaîne de valeur, qui montre où</text><text x="30" y="329" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">la valeur se crée.</text></svg>