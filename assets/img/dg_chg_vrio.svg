<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 448" width="1000" height="448" role="img"><rect width="1000" height="448" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">L’analyse VRIO des ressources de l’entreprise</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Quatre critères pour savoir si une ressource procure un avantage concurrentiel durable : a-t-elle de la valeur, est-elle rare,</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">est-elle difficile à imiter, l’entreprise est-elle organisée pour l’exploiter ?</text><rect x="30" y="108" width="940" height="34" rx="6" fill="#123A63"/><text x="42" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Ressource</text><text x="309.1578947368421" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Valeur</text><text x="408.1052631578947" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Rareté</text><text x="526.8421052631578" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Inimitabilité</text><text x="665.3684210526314" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Ce qu’elle procure</text><rect x="30" y="142" width="940" height="52" fill="white"/><line x1="30" y1="142" x2="970" y2="142" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Expertise optique et conseil</text><text x="42" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">personnalisé</text><text x="309.1578947368421" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui</text><text x="408.1052631578947" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui</text><text x="526.8421052631578" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui</text><text x="665.3684210526314" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un avantage concurrentiel durable, fondé sur</text><text x="665.3684210526314" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">un savoir-faire tacite</text><rect x="30" y="194" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="194" x2="970" y2="194" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Relation de confiance avec la</text><text x="42" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">clientèle locale</text><text x="309.1578947368421" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui</text><text x="408.1052631578947" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui</text><text x="526.8421052631578" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui</text><text x="665.3684210526314" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un capital relationnel que les chaînes ne</text><text x="665.3684210526314" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">peuvent pas racheter</text><rect x="30" y="246" width="940" height="52" fill="white"/><line x1="30" y1="246" x2="970" y2="246" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Appartenance au réseau coopératif</text><text x="309.1578947368421" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui</text><text x="408.1052631578947" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Non</text><text x="526.8421052631578" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Non</text><text x="665.3684210526314" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Des conditions d’achat et un soutien</text><text x="665.3684210526314" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">marketing, mais partagés</text><rect x="30" y="298" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="298" x2="970" y2="298" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Implantation en centre-ville</text><text x="309.1578947368421" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui</text><text x="408.1052631578947" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Partiellement</text><text x="526.8421052631578" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Non</text><text x="665.3684210526314" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une accessibilité, fragilisée par la baisse</text><text x="665.3684210526314" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">de fréquentation</text><rect x="30" y="350" width="940" height="52" fill="white"/><line x1="30" y1="350" x2="970" y2="350" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="370" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Certification qualité de service</text><text x="309.1578947368421" y="370" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui</text><text x="408.1052631578947" y="370" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui</text><text x="526.8421052631578" y="370" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Partiellement</text><text x="665.3684210526314" y="370" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une garantie de professionnalisme, opposable</text><text x="665.3684210526314" y="387" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">au discours des chaînes</text><rect x="30" y="108" width="940" height="294" rx="6" fill="none" stroke="#DCE5EF" stroke-width="1.5"/><text x="30" y="426" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Conclusion : l’avantage de l’entreprise est immatériel. Il repose sur la qualité du service et la relation client, pas sur le volume ni sur</text><text x="30" y="442" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">le prix.</text></svg>