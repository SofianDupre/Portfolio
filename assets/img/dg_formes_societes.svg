<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 413" width="1000" height="413" role="img"><rect width="1000" height="413" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Choisir une forme juridique : les critères qui tranchent</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Comparaison des quatre structures les plus courantes, telle qu’étudiée en droit des sociétés.</text><rect x="30" y="108" width="940" height="34" rx="6" fill="#123A63"/><text x="42" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Forme</text><text x="212.17241379310343" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Responsabilité</text><text x="398.551724137931" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Direction</text><text x="601.1379310344827" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Régime du dirigeant</text><text x="795.6206896551723" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Fiscalité des bénéfices</text><rect x="30" y="142" width="940" height="52" fill="white"/><line x1="30" y1="142" x2="970" y2="142" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Entreprise</text><text x="42" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">individuelle</text><text x="212.17241379310343" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Patrimoine professionnel</text><text x="212.17241379310343" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">séparé depuis 2022</text><text x="398.551724137931" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">L’entrepreneur seul</text><text x="601.1379310344827" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Travailleur non salarié</text><text x="795.6206896551723" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Impôt sur le revenu</text><text x="795.6206896551723" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">(option IS)</text><rect x="30" y="194" width="940" height="69" fill="#F4F7FA"/><line x1="30" y1="194" x2="970" y2="194" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">SARL / EURL</text><text x="212.17241379310343" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Limitée aux apports</text><text x="398.551724137931" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Gérant, majoritaire ou</text><text x="398.551724137931" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">minoritaire</text><text x="601.1379310344827" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">TNS si gérant</text><text x="601.1379310344827" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">majoritaire, assimilé</text><text x="601.1379310344827" y="248" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">salarié sinon</text><text x="795.6206896551723" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Impôt sur les sociétés</text><text x="795.6206896551723" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">(option IR)</text><rect x="30" y="263" width="940" height="52" fill="white"/><line x1="30" y1="263" x2="970" y2="263" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">SAS / SASU</text><text x="212.17241379310343" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Limitée aux apports</text><text x="398.551724137931" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Président, organisation</text><text x="398.551724137931" y="300" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">libre par les statuts</text><text x="601.1379310344827" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Assimilé salarié</text><text x="795.6206896551723" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Impôt sur les sociétés</text><text x="795.6206896551723" y="300" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">(option IR)</text><rect x="30" y="315" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="315" x2="970" y2="315" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">SA</text><text x="212.17241379310343" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Limitée aux apports</text><text x="398.551724137931" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Conseil d’administration</text><text x="398.551724137931" y="352" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">et directeur général</text><text x="601.1379310344827" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Assimilé salarié</text><text x="795.6206896551723" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Impôt sur les sociétés</text><rect x="30" y="108" width="940" height="259" rx="6" fill="none" stroke="#DCE5EF" stroke-width="1.5"/><text x="30" y="391" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le choix de la structure commande le régime social du dirigeant et la fiscalité des bénéfices : c’est une décision de gestion autant que</text><text x="30" y="407" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">juridique.</text></svg>