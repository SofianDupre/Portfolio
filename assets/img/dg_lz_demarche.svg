<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 313" width="1000" height="313" role="img"><rect width="1000" height="313" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Louez-Le — le déroulé du business game</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Un projet entrepreneurial mené en équipe de quatre, de l’idée aux supports de communication.</text><rect x="30.0" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="136" cy="140" r="15" fill="#123A63"/><text x="136.25" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">1</text><text x="136.25" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Cadrer l’offre</text><text x="136.25" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Définir l’activité de</text><text x="136.25" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">location, le public visé et</text><text x="136.25" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">la promesse tenue.</text><path d="M247.5 188.5 L260.5 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M267.5 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="272.5" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="379" cy="140" r="15" fill="#123A63"/><text x="378.75" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">2</text><text x="378.75" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Chiffrer</text><text x="378.75" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Construire la structure de</text><text x="378.75" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">coûts, puis un bilan et un</text><text x="378.75" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">compte de résultat</text><text x="378.75" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">prévisionnels cohérents.</text><path d="M490.0 188.5 L503.0 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M510.0 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="515.0" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="621" cy="140" r="15" fill="#123A63"/><text x="621.25" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">3</text><text x="621.25" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Communiquer</text><text x="621.25" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Produire les affiches, en</text><text x="621.25" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">français et en anglais, avec</text><text x="621.25" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">une identité tenue d’un</text><text x="621.25" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">support à l’autre.</text><path d="M732.5 188.5 L745.5 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M752.5 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="757.5" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="864" cy="140" r="15" fill="#123A63"/><text x="863.75" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">4</text><text x="863.75" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Défendre</text><text x="863.75" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Présenter le projet et</text><text x="863.75" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">répondre aux objections,</text><text x="863.75" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">comme devant un financeur.</text><text x="30" y="291" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Ce que l’exercice a surtout appris : une équipe qui se répartit clairement le travail avance plus vite qu’une équipe qui délibère de tout.</text></svg>