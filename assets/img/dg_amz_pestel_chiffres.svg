<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 599" width="1000" height="599" role="img"><rect width="1000" height="599" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La grille PESTEL — les données chiffrées</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Chaque dimension a été documentée par une source, et non affirmée : c’est ce qui distingue une analyse d’un avis.</text><rect x="30" y="108" width="940" height="34" rx="6" fill="#123A63"/><text x="42" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Dimension</text><text x="218.25" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Ce que disent les chiffres</text><text x="782.25" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Source</text><rect x="30" y="142" width="940" height="69" fill="white"/><line x1="30" y1="142" x2="970" y2="142" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Politique</text><text x="218.25" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Plus de 60 % des pays disposent de lois protégeant l’acheteur en ligne — dont 14</text><text x="218.25" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">jours de rétractation en Europe. TVA due dès 10 000 € de ventes</text><text x="218.25" y="196" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">intra-européennes.</text><text x="782.25" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">OCDE</text><rect x="30" y="211" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="211" x2="970" y2="211" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Économique</text><text x="218.25" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">5 700 milliards de dollars de marché mondial en 2022, 8 100 milliards attendus en</text><text x="218.25" y="248" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">2026, soit 10,4 % de croissance annuelle.</text><text x="782.25" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Statista</text><rect x="30" y="263" width="940" height="52" fill="white"/><line x1="30" y1="263" x2="970" y2="263" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Économique</text><text x="218.25" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">La logistique représente environ 15 % du chiffre d’affaires du secteur ; les</text><text x="218.25" y="300" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">retours coûtent 550 milliards de dollars par an, près de 30 % des ventes.</text><text x="782.25" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">CBRE</text><rect x="30" y="315" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="315" x2="970" y2="315" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Sociale</text><text x="218.25" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">75 % des consommateurs des pays développés ont acheté en ligne en 2022, contre 53</text><text x="218.25" y="352" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">% en 2015.</text><text x="782.25" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Statista</text><rect x="30" y="367" width="940" height="52" fill="white"/><line x1="30" y1="367" x2="970" y2="367" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="387" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Sociale</text><text x="218.25" y="387" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">73 % des consommateurs sont prêts à changer leurs habitudes pour réduire leur</text><text x="218.25" y="404" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">impact ; 81 % attendent des entreprises de meilleures pratiques éthiques.</text><text x="782.25" y="387" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Nielsen</text><rect x="30" y="419" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="419" x2="970" y2="419" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="439" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Technologique</text><text x="218.25" y="439" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Environ 60 % des transactions en ligne de 2022 ont été réalisées depuis un</text><text x="218.25" y="456" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">smartphone.</text><text x="782.25" y="439" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Statista</text><rect x="30" y="471" width="940" height="52" fill="white"/><line x1="30" y1="471" x2="970" y2="471" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="491" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Légale</text><text x="218.25" y="491" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Les litiges de consommation en ligne ont progressé de 30 % en 2021 ; le RGPD</text><text x="218.25" y="508" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">impose une mise en conformité lourde.</text><text x="782.25" y="491" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">European Consumer Centre</text><rect x="30" y="523" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="523" x2="970" y2="523" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="543" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Légale</text><text x="218.25" y="543" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">5 % des produits vendus en ligne étaient des contrefaçons en 2020, soit 500</text><text x="218.25" y="560" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">milliards de dollars de pertes pour les marques.</text><text x="782.25" y="543" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">OCDE</text><rect x="30" y="108" width="940" height="467" rx="6" fill="none" stroke="#DCE5EF" stroke-width="1.5"/></svg>