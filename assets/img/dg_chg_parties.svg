<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img"><rect width="1000" height="540" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La cartographie des parties prenantes</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Chaque acteur est positionné selon son pouvoir sur le projet et son intérêt à le voir aboutir. C’est ce croisement qui dicte</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">la manière de le traiter.</text><rect x="160" y="112" width="672" height="336" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><line x1="496" y1="112" x2="496" y2="448" stroke="#DCE5EF" stroke-width="1.5"/><line x1="160" y1="280" x2="832" y2="280" stroke="#DCE5EF" stroke-width="1.5"/><text x="496" y="480" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Intérêt pour le projet</text><text x="114" y="280" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle" transform="rotate(-90 114 280)">Pouvoir sur le projet</text><text x="328.0" y="182.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Fournisseurs et réseau coopératif</text><text x="328.0" y="208.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Un pouvoir réel sur les conditions, un</text><text x="328.0" y="225.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">intérêt indirect : à tenir informés.</text><text x="664.0" y="182.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Le dirigeant et les salariés</text><text x="664.0" y="208.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Pouvoir et intérêt maximaux : le dirigeant</text><text x="664.0" y="225.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">décide, les salariés exécutent. À associer</text><text x="664.0" y="242.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">étroitement.</text><text x="664.0" y="350.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Clients et professionnels de santé</text><text x="664.0" y="376.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Peu de pouvoir sur la décision, mais un</text><text x="664.0" y="393.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">intérêt direct : à convaincre et à</text><text x="664.0" y="410.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">embarquer.</text><text x="328.0" y="350.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Collectivités et acteurs du territoire</text><text x="328.0" y="376.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Ni pouvoir direct ni intérêt immédiat, mais</text><text x="328.0" y="393.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">des relais utiles : à surveiller.</text><text x="30" y="518" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Les salariés sont la partie prenante la plus sensible : sans leur adhésion, le pivot ne se traduit pas en actes.</text></svg>