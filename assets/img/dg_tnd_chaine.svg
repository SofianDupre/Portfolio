<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 347" width="1000" height="347" role="img"><rect width="1000" height="347" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Du fichier brut à la décision : la chaîne de traitement</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">La progression suivie toute l’année sur des bases réelles — salariés, incidents, accidents du travail, consommations de</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">carburant.</text><rect x="30.0" y="110" width="164.0" height="191" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="112" cy="140" r="15" fill="#123A63"/><text x="112.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">1</text><text x="112.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Fiabiliser</text><text x="112.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Doublons, formats,</text><text x="112.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">valeurs manquantes,</text><text x="112.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">validation des</text><text x="112.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">données.</text><path d="M199.0 205.5 L212.0 205.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M219.0 205.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="224.0" y="110" width="164.0" height="191" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="306" cy="140" r="15" fill="#123A63"/><text x="306.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">2</text><text x="306.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Calculer</text><text x="306.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Fonctions</text><text x="306.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">statistiques et</text><text x="306.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">logiques, SI</text><text x="306.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">imbriqués,</text><text x="306.0" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">SOMME.SI.ENS.</text><path d="M393.0 205.5 L406.0 205.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M413.0 205.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="418.0" y="110" width="164.0" height="191" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="500" cy="140" r="15" fill="#123A63"/><text x="500.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">3</text><text x="500.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Rapprocher</text><text x="500.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">RECHERCHEV, INDEX et</text><text x="500.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">EQUIV : croiser deux</text><text x="500.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">fichiers par une clé.</text><path d="M587.0 205.5 L600.0 205.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M607.0 205.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="612.0" y="110" width="164.0" height="191" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="694" cy="140" r="15" fill="#123A63"/><text x="694.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">4</text><text x="694.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Synthétiser</text><text x="694.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Tris, filtres</text><text x="694.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">avancés, sous-totaux</text><text x="694.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">et tableaux croisés</text><text x="694.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">dynamiques.</text><path d="M781.0 205.5 L794.0 205.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M801.0 205.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="806.0" y="110" width="164.0" height="191" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="888" cy="140" r="15" fill="#123A63"/><text x="888.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">5</text><text x="888.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Consolider</text><text x="888.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Liaisons entre</text><text x="888.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">feuilles et</text><text x="888.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">consolidation</text><text x="888.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">multi-sources en un</text><text x="888.0" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">tableau de bord</text><text x="888.0" y="290" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">unique.</text><text x="30" y="325" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une donnée non fiabilisée produit un tableau croisé faux et convaincant : c’est le principal enseignement de ces travaux pratiques.</text></svg>