<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img"><rect width="1000" height="540" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Typologie de l’innovation : le cas des journaux gratuits</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">En 2002, l’irruption des gratuits dans un champ verrouillé — et une innovation qui n’est pas technologique.</text><rect x="160" y="112" width="672" height="336" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><line x1="496" y1="112" x2="496" y2="448" stroke="#DCE5EF" stroke-width="1.5"/><line x1="160" y1="280" x2="832" y2="280" stroke="#DCE5EF" stroke-width="1.5"/><text x="496" y="480" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Ampleur de la rupture</text><text x="114" y="280" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle" transform="rotate(-90 114 280)">Dimension technologique</text><text x="328.0" y="182.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Innovation radicale</text><text x="328.0" y="208.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Forte connotation technologique : une</text><text x="328.0" y="225.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">technologie nouvelle redéfinit l’offre.</text><text x="664.0" y="182.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Innovation de rupture</text><text x="664.0" y="208.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le marché est bouleversé, mais le produit</text><text x="664.0" y="225.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">reste le même — ici, un journal.</text><text x="664.0" y="350.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Innovation d’usage</text><text x="664.0" y="376.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Lecture rapide, consommation dans les</text><text x="664.0" y="393.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">transports : un nouveau moment de</text><text x="664.0" y="410.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">consommation.</text><text x="328.0" y="350.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Innovation incrémentale</text><text x="328.0" y="376.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Amélioration continue de l’existant, sans</text><text x="328.0" y="393.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">remise en cause du modèle.</text><text x="30" y="518" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le cas des gratuits relève de l’innovation de modèle économique : gratuité pour le lecteur, financement quasi exclusif par la publicité —</text><text x="30" y="534" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">dans un champ verrouillé par la loi Bichet, le syndicat du Livre et les NMPP.</text></svg>