<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 276" width="1000" height="276" role="img"><rect width="1000" height="276" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Les trois piliers du développement durable</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le projet est évalué sur les trois dimensions, et pas seulement sur son équilibre financier.</text><rect x="30.0" y="108" width="302.6666666666667" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Économique</text><text x="181.33333333333334" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Réduire le coût du transport pour les</text><text x="181.33333333333334" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">usagers et s’appuyer sur des partenariats</text><text x="181.33333333333334" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">d’entreprises du territoire qui proposent</text><text x="181.33333333333334" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">le service à leurs salariés.</text><rect x="348.6666666666667" y="108" width="302.6666666666667" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Sociétal</text><text x="500.0" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Créer du lien entre des personnes qui font</text><text x="500.0" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">le même trajet seules, et donner une place</text><text x="500.0" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">aux habitants dans la gouvernance de la</text><text x="500.0" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">coopérative.</text><rect x="667.3333333333334" y="108" width="302.6666666666667" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Environnemental</text><text x="818.6666666666667" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Faire baisser les émissions de CO₂ des</text><text x="818.6666666666667" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">trajets domicile-travail en remplissant</text><text x="818.6666666666667" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">des véhicules qui roulent déjà.</text></svg>