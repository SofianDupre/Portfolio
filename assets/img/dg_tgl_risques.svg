<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img"><rect width="1000" height="540" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">L’évaluation de l’intensité des risques</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Chaque risque est positionné selon sa probabilité d’apparition et son impact sur l’organisation.</text><rect x="160" y="112" width="672" height="336" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><line x1="496" y1="112" x2="496" y2="448" stroke="#DCE5EF" stroke-width="1.5"/><line x1="160" y1="280" x2="832" y2="280" stroke="#DCE5EF" stroke-width="1.5"/><text x="496" y="480" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Probabilité d’apparition</text><text x="114" y="280" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle" transform="rotate(-90 114 280)">Impact sur l’organisation</text><text x="328.0" y="182.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Cybersécurité et données</text><text x="328.0" y="208.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Peu fréquent, mais des conséquences lourdes</text><text x="328.0" y="225.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">: continuité du service et responsabilité de</text><text x="328.0" y="242.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’organisation.</text><text x="664.0" y="182.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Adhésion et formation</text><text x="664.0" y="208.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le risque le plus sensible : des outils</text><text x="664.0" y="225.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">déployés que les équipes n’adoptent pas.</text><text x="664.0" y="350.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Surcoûts et retards</text><text x="664.0" y="376.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Fréquent sur un projet informatique, mais</text><text x="664.0" y="393.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">absorbable s’il est anticipé au budget.</text><text x="328.0" y="350.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Pannes et anomalies techniques</text><text x="328.0" y="376.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Ponctuelles, corrigées par les tests des</text><text x="328.0" y="393.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">cycles courts : peu d’effet durable sur le</text><text x="328.0" y="410.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">service.</text><text x="30" y="518" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Lecture : le quadrant en haut à droite est celui qui appelle un plan de réponse écrit avant le lancement.</text></svg>