<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 347" width="1000" height="347" role="img"><rect width="1000" height="347" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Les deux mises en situation du module</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">La partie appliquée du cours : deux cas d’équipe à traiter en groupe, puis à défendre.</text><rect x="30.0" y="110" width="212.5" height="191" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="136" cy="140" r="15" fill="#123A63"/><text x="136.25" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">1</text><text x="136.25" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Manager d’un soir</text><text x="136.25" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Promu manager d’une équipe</text><text x="136.25" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">projet de quatre personnes,</text><text x="136.25" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">trois semaines pour organiser</text><text x="136.25" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">un événement interne, un</text><text x="136.25" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">budget limité et des profils</text><text x="136.25" y="290" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">contrastés.</text><path d="M247.5 205.5 L260.5 205.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M267.5 205.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="272.5" y="110" width="212.5" height="191" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="379" cy="140" r="15" fill="#123A63"/><text x="378.75" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">2</text><text x="378.75" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Répartir et choisir</text><text x="378.75" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Confier les bonnes missions</text><text x="378.75" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">aux bonnes personnes, puis</text><text x="378.75" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">choisir une posture</text><text x="378.75" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">managériale pour chacune —</text><text x="378.75" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">directive, persuasive,</text><text x="378.75" y="290" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">participative ou délégative.</text><path d="M490.0 205.5 L503.0 205.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M510.0 205.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="515.0" y="110" width="212.5" height="191" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="621" cy="140" r="15" fill="#123A63"/><text x="621.25" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">3</text><text x="621.25" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">L’équipe démotivée</text><text x="621.25" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Cinq collaborateurs à</text><text x="621.25" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">remobiliser autour du</text><text x="621.25" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">lancement d’une offre en</text><text x="621.25" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">trois mois, chacun bloqué</text><text x="621.25" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">pour une raison différente.</text><path d="M732.5 205.5 L745.5 205.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M752.5 205.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="757.5" y="110" width="212.5" height="191" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="864" cy="140" r="15" fill="#123A63"/><text x="863.75" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">4</text><text x="863.75" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Diagnostiquer</text><text x="863.75" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Relier chaque situation aux</text><text x="863.75" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">modèles de Maslow, Herzberg</text><text x="863.75" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">et Vroom — puis proposer une</text><text x="863.75" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">action et une posture</text><text x="863.75" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">adaptées.</text><text x="30" y="325" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">L’évaluation du module combine trois notes : la participation, une épreuve théorique et un cas pratique en fin de module, celui-ci au</text><text x="30" y="341" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">coefficient le plus élevé.</text></svg>