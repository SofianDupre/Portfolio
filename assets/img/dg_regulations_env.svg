<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" width="1000" height="395" role="img"><rect width="1000" height="395" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Taxes, quotas, réglementation : trois façons de corriger une externalité</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">La comparaison construite dans le dossier 3 d’économie.</text><rect x="30" y="108" width="940" height="34" rx="6" fill="#123A63"/><text x="42" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Instrument</text><text x="233.83673469387753" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Mécanisme</text><text x="531.1836734693877" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Ce qu’il garantit</text><text x="742.204081632653" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Limite principale</text><rect x="30" y="142" width="940" height="69" fill="white"/><line x1="30" y1="142" x2="970" y2="142" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Taxe pigouvienne</text><text x="233.83673469387753" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Faire payer aux agents le coût social de</text><text x="233.83673469387753" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">leur activité polluante : plus on pollue,</text><text x="233.83673469387753" y="196" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">plus on paie</text><text x="531.1836734693877" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le prix de la pollution est</text><text x="531.1836734693877" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">connu</text><text x="742.204081632653" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le volume total d’émissions</text><text x="742.204081632653" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">reste incertain</text><rect x="30" y="211" width="940" height="69" fill="#F4F7FA"/><line x1="30" y1="211" x2="970" y2="211" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Quota échangeable</text><text x="233.83673469387753" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Fixer un plafond global d’émissions, puis</text><text x="233.83673469387753" y="248" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">laisser le marché déterminer le prix de</text><text x="233.83673469387753" y="265" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">la pollution</text><text x="531.1836734693877" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le volume maximal</text><text x="531.1836734693877" y="248" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">d’émissions est certain</text><text x="742.204081632653" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le prix peut s’effondrer ou</text><text x="742.204081632653" y="248" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">s’emballer</text><rect x="30" y="280" width="940" height="69" fill="white"/><line x1="30" y1="280" x2="970" y2="280" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="300" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Réglementation</text><text x="233.83673469387753" y="300" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Imposer une norme, une obligation ou une</text><text x="233.83673469387753" y="317" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">interdiction</text><text x="531.1836734693877" y="300" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">L’effet est direct et</text><text x="531.1836734693877" y="317" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">lisible</text><text x="742.204081632653" y="300" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Coût d’application élevé, peu</text><text x="742.204081632653" y="317" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">d’incitation à faire mieux que</text><text x="742.204081632653" y="334" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">la norme</text><rect x="30" y="108" width="940" height="241" rx="6" fill="none" stroke="#DCE5EF" stroke-width="1.5"/><text x="30" y="373" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Les trois poursuivent le même objectif : internaliser dans les décisions privées un coût que la société supporte. Le quota garantit la</text><text x="30" y="389" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">quantité, la taxe garantit le prix.</text></svg>