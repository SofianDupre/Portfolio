<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img"><rect width="1000" height="340" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La conclusion défendue à l’oral</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Ce que l’étude retient, une fois le diagnostic posé.</text><rect x="30" y="104" width="940" height="200" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><text x="500" y="146" font-family="Lato, sans-serif" font-size="15" font-weight="400" fill="#123A63" text-anchor="middle">Le projet stratégique d’Amazon repose sur une approche à la fois diversifiée et innovante : maintenir sa</text><text x="500" y="168" font-family="Lato, sans-serif" font-size="15" font-weight="400" fill="#123A63" text-anchor="middle">domination dans le e-commerce tout en explorant le cloud, le divertissement numérique, la santé et</text><text x="500" y="190" font-family="Lato, sans-serif" font-size="15" font-weight="400" fill="#123A63" text-anchor="middle">l’alimentation.</text><text x="500" y="226" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="middle">Mais l’analyse SWOT met en lumière trois vulnérabilités : la dépendance aux marges d’AWS, les critiques sur les</text><text x="500" y="246" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="middle">conditions de travail et les risques réglementaires croissants.</text><text x="30" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">La capacité d’Amazon à innover, à s’adapter à la concurrence et à gérer les menaces externes sera décisive pour préserver sa position.</text></svg>