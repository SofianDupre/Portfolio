<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 381" width="1000" height="381" role="img"><rect width="1000" height="381" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">L’analyse du marché</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Trois lectures croisées : ce qui manque aux frontaliers aujourd’hui, ce qui fera qu’une plateforme sera adoptée, et ce qui</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">joue en faveur du projet.</text><rect x="30.0" y="108" width="302.6666666666667" height="249" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="108" width="303" height="28" rx="10" fill="#123A63"/><rect x="30" y="124" width="303" height="12" fill="#123A63"/><text x="45.0" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">BESOINS IDENTIFIÉS</text><circle cx="46" cy="152" r="2.5" fill="#17879E"/><text x="57.0" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un manque de solutions flexibles,</text><text x="57.0" y="173" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">adaptées aux horaires réels</text><circle cx="46" cy="195" r="2.5" fill="#17879E"/><text x="57.0" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un coût élevé du transport individuel,</text><text x="57.0" y="216" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">carburant et entretien compris</text><circle cx="46" cy="238" r="2.5" fill="#17879E"/><text x="57.0" y="242" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une demande de solutions durables,</text><text x="57.0" y="259" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">portée par les usagers eux-mêmes</text><rect x="348.6666666666667" y="108" width="302.6666666666667" height="249" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="349" y="108" width="303" height="28" rx="10" fill="#123A63"/><rect x="349" y="124" width="303" height="12" fill="#123A63"/><text x="363.6666666666667" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">FACTEURS CLÉS DE SUCCÈS</text><circle cx="365" cy="152" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une plateforme simple, fiable et rapide</text><text x="375.6666666666667" y="173" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">— sinon elle n’est pas utilisée</text><circle cx="365" cy="195" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une communication locale ciblée,</text><text x="375.6666666666667" y="216" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">commune par commune</text><circle cx="365" cy="238" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="242" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une communauté engagée, qui</text><text x="375.6666666666667" y="259" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">s’auto-alimente en trajets</text><rect x="667.3333333333334" y="108" width="302.6666666666667" height="249" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="667" y="108" width="303" height="28" rx="10" fill="#123A63"/><rect x="667" y="124" width="303" height="12" fill="#123A63"/><text x="682.3333333333334" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">OPPORTUNITÉS</text><circle cx="683" cy="152" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une transition écologique soutenue par</text><text x="694.3333333333334" y="173" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">les pouvoirs publics</text><circle cx="683" cy="195" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un marché transfrontalier en croissance</text><text x="694.3333333333334" y="216" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">continue</text><circle cx="683" cy="238" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="242" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une tendance de fond favorable au</text><text x="694.3333333333334" y="259" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">covoiturage</text><circle cx="683" cy="281" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="285" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">L’intérêt des entreprises</text><text x="694.3333333333334" y="302" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">luxembourgeoises pour la mobilité de</text><text x="694.3333333333334" y="319" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">leurs salariés</text></svg>