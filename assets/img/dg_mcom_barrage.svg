<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 298" width="1000" height="298" role="img"><rect width="1000" height="298" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Passer le barrage de l’accueil</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">L’assistant ou l’assistante de direction n’est pas un obstacle à contourner : c’est la personne qui sait qui décide, et quand</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">l’appeler.</text><rect x="30.0" y="108" width="223.0" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="124" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="141.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Professionnalisme</text><text x="141.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Se présenter clairement,</text><text x="141.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">rester courtois et sûr de soi.</text><text x="141.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">L’hésitation est ce qui fait</text><text x="141.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">raccrocher.</text><rect x="269.0" y="108" width="223.0" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="364" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="380.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Légitimité</text><text x="380.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Demander la personne par son</text><text x="380.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">nom plutôt que « le</text><text x="380.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">responsable des achats » : la</text><text x="380.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">différence est immédiate.</text><rect x="508.0" y="108" width="223.0" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="602" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="619.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Raison précise</text><text x="619.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Donner une raison qui a de la</text><text x="619.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">valeur — une solution, un</text><text x="619.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">suivi, une offre adaptée — et</text><text x="619.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">non « me présenter ».</text><rect x="747.0" y="108" width="223.0" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="842" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="858.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Relation</text><text x="858.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Traiter l’interlocuteur comme</text><text x="858.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">un allié. C’est souvent lui</text><text x="858.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">qui indique le bon moment pour</text><text x="858.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">rappeler.</text><text x="30" y="276" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Trois techniques qui fonctionnent : varier les horaires — avant 9 h, après 17 h —, demander à être transféré plutôt qu’un numéro, et adopter</text><text x="30" y="292" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">une approche « service » plutôt qu’une approche « vente ».</text></svg>