<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 532" width="1000" height="532" role="img"><rect width="1000" height="532" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La cascade des soldes intermédiaires de gestion</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Du chiffre d’affaires au résultat net : chaque solde répond à une question précise sur la performance de l’entreprise.</text><rect x="30" y="108" width="940" height="42" rx="8" fill="#17879E"/><text x="46.0" y="135" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">Chiffre d’affaires</text><text x="954.0" y="135" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">ce que l’activité rapporte</text><path d="M500 152 l-6 0 l6 10 l6 -10 z" fill="#DCE5EF"/><rect x="56" y="164" width="888" height="42" rx="8" fill="#123A63"/><text x="71.85000000000002" y="191" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">Marge commerciale</text><text x="928.15" y="191" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">− coût d’achat des marchandises vendues</text><path d="M500 208 l-6 0 l6 10 l6 -10 z" fill="#DCE5EF"/><rect x="82" y="220" width="837" height="42" rx="8" fill="#17879E"/><text x="97.69999999999999" y="247" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">Valeur ajoutée</text><text x="902.3" y="247" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">− consommations en provenance des tiers</text><path d="M500 264 l-6 0 l6 10 l6 -10 z" fill="#DCE5EF"/><rect x="108" y="276" width="785" height="42" rx="8" fill="#123A63"/><text x="123.55000000000001" y="303" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">Excédent brut d’exploitation</text><text x="876.45" y="303" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">− charges de personnel et impôts, + subventions</text><path d="M500 320 l-6 0 l6 10 l6 -10 z" fill="#DCE5EF"/><rect x="133" y="332" width="733" height="42" rx="8" fill="#17879E"/><text x="149.39999999999998" y="359" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">Résultat d’exploitation</text><text x="850.6" y="359" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">− dotations aux amortissements et provisions</text><path d="M500 376 l-6 0 l6 10 l6 -10 z" fill="#DCE5EF"/><rect x="159" y="388" width="682" height="42" rx="8" fill="#123A63"/><text x="175.25" y="415" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">Résultat courant avant impôts</text><text x="824.75" y="415" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">± résultat financier</text><path d="M500 432 l-6 0 l6 10 l6 -10 z" fill="#DCE5EF"/><rect x="185" y="444" width="630" height="42" rx="8" fill="#17879E"/><text x="201.10000000000002" y="471" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">Résultat net</text><text x="798.9" y="471" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">± résultat exceptionnel − impôt sur les bénéfices</text><text x="30" y="510" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">En parallèle, le trio fonds de roulement — besoin en fonds de roulement — trésorerie nette mesure l’équilibre financier : FR − BFR = TN.</text></svg>