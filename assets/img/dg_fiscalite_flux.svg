<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img"><rect width="1000" height="330" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">De la TVA à l’impôt sur les bénéfices</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Les deux chaînes fiscales travaillées en cours : celle qui transite par l’entreprise, et celle qui pèse sur son résultat.</text><rect x="30.0" y="110" width="164.0" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="112" cy="140" r="15" fill="#123A63"/><text x="112.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">1</text><text x="112.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">TVA collectée</text><text x="112.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Facturée au client</text><text x="112.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">sur les ventes, elle</text><text x="112.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">ne constitue jamais</text><text x="112.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">un produit pour</text><text x="112.0" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’entreprise.</text><path d="M199.0 197.0 L212.0 197.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M219.0 197.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="224.0" y="110" width="164.0" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="306" cy="140" r="15" fill="#123A63"/><text x="306.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">2</text><text x="306.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">TVA déductible</text><text x="306.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Supportée sur les</text><text x="306.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">achats et les</text><text x="306.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">immobilisations, elle</text><text x="306.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">vient en déduction.</text><path d="M393.0 197.0 L406.0 197.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M413.0 197.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="418.0" y="110" width="164.0" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="500" cy="140" r="15" fill="#123A63"/><text x="500.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">3</text><text x="500.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">TVA à décaisser</text><text x="500.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">La différence est</text><text x="500.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">reversée à l’État ;</text><text x="500.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">un solde négatif</text><text x="500.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">ouvre droit à crédit</text><text x="500.0" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">de TVA.</text><path d="M587.0 197.0 L600.0 197.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M607.0 197.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="612.0" y="110" width="164.0" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="694" cy="140" r="15" fill="#123A63"/><text x="694.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">4</text><text x="694.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Résultat fiscal</text><text x="694.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Résultat comptable</text><text x="694.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">corrigé des</text><text x="694.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">réintégrations et des</text><text x="694.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">déductions</text><text x="694.0" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">extra-comptables.</text><path d="M781.0 197.0 L794.0 197.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M801.0 197.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="806.0" y="110" width="164.0" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="888" cy="140" r="15" fill="#123A63"/><text x="888.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">5</text><text x="888.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Impôt dû</text><text x="888.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">IS au taux normal ou</text><text x="888.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">réduit pour les</text><text x="888.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">sociétés, IR dans la</text><text x="888.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">catégorie des BIC</text><text x="888.0" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">pour l’entrepreneur.</text><text x="30" y="308" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">La forme juridique retenue au semestre précédent détermine laquelle des deux voies d’imposition des bénéfices s’applique.</text></svg>