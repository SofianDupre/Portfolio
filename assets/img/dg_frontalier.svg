<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 315" width="1000" height="315" role="img"><rect width="1000" height="315" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Travailler au Luxembourg : ce qui change pour un frontalier</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le module transfrontalier de l’IUT de Longwy, appliqué ensuite pendant tout le stage en agence d’emploi à Belval.</text><rect x="30.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="124" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="141.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Contrat de travail</text><text x="141.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Droit luxembourgeois : période</text><text x="141.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">d’essai, durée du travail,</text><text x="141.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">congés et préavis obéissent à</text><text x="141.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">des règles propres au</text><text x="141.5" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Grand-Duché.</text><rect x="269.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="364" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="380.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Protection sociale</text><text x="380.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Affiliation au régime du pays</text><text x="380.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">d’emploi, avec coordination</text><text x="380.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">européenne des droits acquis.</text><rect x="508.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="602" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="619.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Fiscalité</text><text x="619.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Imposition dans le pays</text><text x="619.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">d’activité, conventions</text><text x="619.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">fiscales bilatérales et seuils</text><text x="619.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">de tolérance pour le</text><text x="619.5" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">télétravail.</text><rect x="747.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="842" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="858.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Marché de l’emploi</text><text x="858.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Secteurs porteurs, rôle de</text><text x="858.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’ADEM, plurilinguisme exigé :</text><text x="858.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">français, anglais, souvent</text><text x="858.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">allemand ou luxembourgeois.</text><text x="30" y="293" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Compétence directement réinvestie : expliquer à un candidat les conséquences concrètes d’une mission au Luxembourg.</text></svg>