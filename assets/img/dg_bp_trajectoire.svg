<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 516" width="1000" height="516" role="img"><rect width="1000" height="516" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Business plan : la trajectoire sur trois exercices</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Application d’apprentissage linguistique avec immersion culturelle — l’indicateur clé de chaque exercice, en pourcentage du</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">chiffre d’affaires.</text><line x1="30" y1="140" x2="970" y2="140" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="140" width="299" height="210" rx="5" fill="#C0563F"/><text x="179.33333333333334" y="165.91639295312035" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">-61,18 %</text><text x="179.33333333333334" y="386" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Année N</text><text x="179.33333333333334" y="410" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">EBE négatif : le poids des charges de structure</text><text x="179.33333333333334" y="426" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">au lancement, malgré une marge commerciale de</text><text x="179.33333333333334" y="442" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">91,73 % du CA</text><rect x="351" y="120" width="299" height="20" rx="5" fill="#17879E"/><text x="500.0" y="108.00000000000001" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="#123A63" text-anchor="middle">5,8 %</text><text x="500.0" y="386" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Année N+1</text><text x="500.0" y="410" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">EBE redevenu positif, mais un résultat encore</text><text x="500.0" y="426" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">fragile</text><rect x="671" y="128" width="299" height="12" rx="5" fill="#17879E"/><text x="820.6666666666667" y="115.86354135562857" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="#123A63" text-anchor="middle">3,51 %</text><text x="820.6666666666667" y="386" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Année N+2</text><text x="820.6666666666667" y="410" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">Résultat net positif, obtenu par une meilleure</text><text x="820.6666666666667" y="426" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">maîtrise des charges</text><text x="30" y="494" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un prévisionnel crédible assume ses premières années déficitaires : c’est le retour à l’équilibre qui doit être démontré, pas la rentabilité</text><text x="30" y="510" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">immédiate.</text></svg>