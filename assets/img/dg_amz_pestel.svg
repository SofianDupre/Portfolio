<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><rect width="1000" height="470" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">L’analyse PESTEL du commerce en ligne</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">La grille renseignée, utilisée comme support d’analyse externe avant le diagnostic stratégique du groupe.</text><rect x="30.0" y="108" width="302.6666666666667" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Politique</text><text x="181.33333333333334" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Réglementation du commerce en ligne : lois</text><text x="181.33333333333334" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">de protection du consommateur et</text><text x="181.33333333333334" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">conformité des produits. Fiscalité : des</text><text x="181.33333333333334" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">règles de TVA complexes, surtout sur les</text><text x="181.33333333333334" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">ventes internationales.</text><rect x="348.6666666666667" y="108" width="302.6666666666667" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Économique</text><text x="500.0" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Croissance forte du secteur, accélérée par</text><text x="500.0" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">la digitalisation. En regard, des coûts</text><text x="500.0" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">logistiques — livraison et gestion des</text><text x="500.0" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">retours — qui pèsent sur la rentabilité.</text><rect x="667.3333333333334" y="108" width="302.6666666666667" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Sociale</text><text x="818.6666666666667" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Les habitudes d’achat basculent en ligne</text><text x="818.6666666666667" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">pour la commodité. Et les consommateurs</text><text x="818.6666666666667" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">exigent des pratiques plus durables et</text><text x="818.6666666666667" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">plus éthiques.</text><rect x="30.0" y="285" width="302.6666666666667" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="303" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="333" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Technologique</text><text x="181.33333333333334" y="361" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Paiements sécurisés, intelligence</text><text x="181.33333333333334" y="378" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">artificielle, automatisation des</text><text x="181.33333333333334" y="395" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">entrepôts. Revers : la nécessité de</text><text x="181.33333333333334" y="412" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">protéger les données clients et les</text><text x="181.33333333333334" y="429" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">systèmes.</text><rect x="348.6666666666667" y="285" width="302.6666666666667" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="303" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="333" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Environnementale</text><text x="500.0" y="361" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Pressions pour réduire les emballages et</text><text x="500.0" y="378" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’empreinte carbone des livraisons, et</text><text x="500.0" y="395" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">pour traiter les déchets liés aux retours.</text><rect x="667.3333333333334" y="285" width="302.6666666666667" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="303" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="333" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Légale</text><text x="818.6666666666667" y="361" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Obligations de retour et de garantie,</text><text x="818.6666666666667" y="378" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">conformité au RGPD, et lutte contre la</text><text x="818.6666666666667" y="395" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">contrefaçon sur les plateformes.</text></svg>