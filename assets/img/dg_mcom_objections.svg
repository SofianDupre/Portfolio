<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 291" width="1000" height="291" role="img"><rect width="1000" height="291" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Le traitement des objections</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Une objection n’est pas un refus : c’est une information sur ce qui bloque. Quatre temps pour la traiter sans passer en force.</text><rect x="30.0" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="136" cy="140" r="15" fill="#123A63"/><text x="136.25" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">1</text><text x="136.25" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Écouter et reformuler</text><text x="136.25" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Montrer que l’objection a été</text><text x="136.25" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">comprise, avec les mots du</text><text x="136.25" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">prospect.</text><path d="M247.5 188.5 L260.5 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M267.5 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="272.5" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="379" cy="140" r="15" fill="#123A63"/><text x="378.75" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">2</text><text x="378.75" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Valoriser</text><text x="378.75" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Reconnaître que le point</text><text x="378.75" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">soulevé est légitime — prix,</text><text x="378.75" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">concurrence, délai, absence</text><text x="378.75" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">de besoin.</text><path d="M490.0 188.5 L503.0 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M510.0 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="515.0" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="621" cy="140" r="15" fill="#123A63"/><text x="621.25" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">3</text><text x="621.25" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Répondre</text><text x="621.25" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Un argument adapté à</text><text x="621.25" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’objection précise, et un</text><text x="621.25" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">seul. L’accumulation</text><text x="621.25" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">d’arguments affaiblit.</text><path d="M732.5 188.5 L745.5 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M752.5 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="757.5" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="864" cy="140" r="15" fill="#123A63"/><text x="863.75" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">4</text><text x="863.75" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Relancer</text><text x="863.75" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Ramener l’échange vers la</text><text x="863.75" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">prise de rendez-vous, sans</text><text x="863.75" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">attendre que le prospect le</text><text x="863.75" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">propose.</text></svg>