<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 306" width="1000" height="306" role="img"><rect width="1000" height="306" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">L’analyse d’opportunités</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Quatre axes sur lesquels le management de projet peut créer de la valeur chez Decathlon.</text><rect x="30" y="108" width="940" height="34" rx="6" fill="#123A63"/><text x="42" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Axe</text><text x="366.1379310344828" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Opportunité clé</text><rect x="30" y="142" width="940" height="35" fill="white"/><line x1="30" y1="142" x2="970" y2="142" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Projets internationaux</text><text x="366.1379310344828" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Coopération entre filiales et partage des innovations.</text><rect x="30" y="177" width="940" height="35" fill="#F4F7FA"/><line x1="30" y1="177" x2="970" y2="177" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="197" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Pilotage agile et digitalisation</text><text x="366.1379310344828" y="197" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Déploiement d’outils numériques pour optimiser le suivi de projet.</text><rect x="30" y="212" width="940" height="35" fill="white"/><