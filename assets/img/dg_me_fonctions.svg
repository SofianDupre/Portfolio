<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355" width="1000" height="355" role="img"><rect width="1000" height="355" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Les quatre fonctions du manager</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">La colonne vertébrale du cours : ce qu’un manager fait concrètement, au quotidien.</text><rect x="30.0" y="108" width="223.0" height="223" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="108" width="223" height="28" rx="10" fill="#123A63"/><rect x="30" y="124" width="223" height="12" fill="#123A63"/><text x="45.0" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">PLANIFIER ET ORGANISER</text><circle cx="46" cy="152" r="2.5" fill="#17879E"/><text x="57.0" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Fixer des objectifs clairs</text><text x="57.0" y="173" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">et atteignables</text><circle cx="46" cy="195" r="2.5" fill="#17879E"/><text x="57.0" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Planifier les actions : qui</text><text x="57.0" y="216" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">fait quoi, quand, avec</text><text x="57.0" y="233" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">quels moyens</text><circle cx="46" cy="255" r="2.5" fill="#17879E"/><text x="57.0" y="259" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Structurer les ressources :</text><text x="57.0" y="276" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">temps, budget, outils,</text><text x="57.0" y="293" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">compétences</text><rect x="269.0" y="108" width="223.0" height="223" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="269" y="108" width="223" height="28" rx="10" fill="#123A63"/><rect x="269" y="124" width="223" height="12" fill="#123A63"/><text x="284.0" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">ANIMER ET MOTIVER</text><circle cx="285" cy="152" r="2.5" fill="#17879E"/><text x="296.0" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Donner du sens et de</text><text x="296.0" y="173" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">l’énergie</text><circle cx="285" cy="195" r="2.5" fill="#17879E"/><text x="296.0" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Communiquer la vision et</text><text x="296.0" y="216" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">créer l’adhésion</text><circle cx="285" cy="238" r="2.5" fill="#17879E"/><text x="296.0" y="242" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Utiliser les leviers :</text><text x="296.0" y="259" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">reconnaissance, autonomie,</text><text x="296.0" y="276" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">défis</text><rect x="508.0" y="108" width="223.0" height="223" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="508" y="108" width="223" height="28" rx="10" fill="#123A63"/><rect x="508" y="124" width="223" height="12" fill="#123A63"/><text x="523.0" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">CONTRÔLER ET ÉVALUER</text><circle cx="524" cy="152" r="2.5" fill="#17879E"/><text x="535.0" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Suivre l’avancement par des</text><text x="535.0" y="173" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">indicateurs</text><circle cx="524" cy="195" r="2.5" fill="#17879E"/><text x="535.0" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Vérifier la qualité et</text><text x="535.0" y="216" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">corriger si besoin</text><circle cx="524" cy="238" r="2.5" fill="#17879E"/><text x="535.0" y="242" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Donner du retour : ce qui</text><text x="535.0" y="259" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">va, et les pistes</text><text x="535.0" y="276" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">d’amélioration</text><rect x="747.0" y="108" width="223.0" height="223" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="747" y="108" width="223" height="28" rx="10" fill="#123A63"/><rect x="747" y="124" width="223" height="12" fill="#123A63"/><text x="762.0" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">DÉVELOPPER</text><circle cx="763" cy="152" r="2.5" fill="#17879E"/><text x="774.0" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Former et transmettre</text><circle cx="763" cy="178" r="2.5" fill="#17879E"/><text x="774.0" y="182" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Faire grandir les</text><text x="774.0" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">compétences de chacun</text><circle cx="763" cy="221" r="2.5" fill="#17879E"/><text x="774.0" y="225" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Construire l’autonomie</text><text x="774.0" y="242" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">plutôt que la dépendance</text></svg>