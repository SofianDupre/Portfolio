<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img"><rect width="1000" height="392" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Ce que le format vidéo change par rapport au CV papier</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le même contenu, mais les critères de jugement ne sont pas les mêmes.</text><rect x="30" y="108" width="940" height="34" rx="6" fill="#123A63"/><text x="42" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Critère</text><text x="260.90410958904107" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">CV papier</text><text x="582.821917808219" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">CV vidéo</text><rect x="30" y="142" width="940" height="52" fill="white"/><line x1="30" y1="142" x2="970" y2="142" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Ce qui est jugé</text><text x="260.90410958904107" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le contenu : formation, expériences,</text><text x="260.90410958904107" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">compétences</text><text x="582.821917808219" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le contenu et la manière de le porter : voix, posture,</text><text x="582.821917808219" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">regard</text><rect x="30" y="194" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="194" x2="970" y2="194" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Temps de lecture</text><text x="260.90410958904107" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le recruteur balaie la page et s’arrête où</text><text x="260.90410958904107" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">il veut</text><text x="582.821917808219" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le recruteur suit un déroulé imposé, du début à la fin</text><rect x="30" y="246" width="940" height="52" fill="white"/><line x1="30" y1="246" x2="970" y2="246" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Marge d’erreur</text><text x="260.90410958904107" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une relecture corrige tout avant l’envoi</text><text x="582.821917808219" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une hésitation se voit ; seule la répétition la fait</text><text x="582.821917808219" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">disparaître</text><rect x="30" y="298" width="940" height="35" fill="#F4F7FA"/><line x1="30" y1="298" x2="970" y2="298" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Ce qu’il faut préparer</text><text x="260.90410958904107" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">La mise en page et la précision des libellés</text><text x="582.821917808219" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le script, le rythme, le cadrage, la lumière et le son</text><rect x="30" y="333" width="940" height="35" fill="white"/><line x1="30" y1="333" x2="970" y2="333" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="353" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Ce qu’il démontre</text><text x="260.90410958904107" y="353" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">La rigueur et la cohérence du parcours</text><text x="582.821917808219" y="353" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">L’aisance orale et la capacité à convaincre en direct</text><rect x="30" y="108" width="940" height="260" rx="6" fill="none" stroke="#DCE5EF" stroke-width="1.5"/></svg>