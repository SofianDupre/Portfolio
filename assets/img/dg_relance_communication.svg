<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" width="1000" height="364" role="img"><rect width="1000" height="364" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Relancer une entreprise en difficulté</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le cas travaillé toute l’année : un fabricant français de chaussures d’alpinisme fondé en 1970, rattrapé par la concurrence</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">internationale.</text><rect x="30.0" y="110" width="164.0" height="208" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="112" cy="140" r="15" fill="#123A63"/><text x="112.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">1</text><text x="112.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Diagnostic</text><text x="112.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Montée des grands</text><text x="112.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">groupes,</text><text x="112.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">délocalisation vers</text><text x="112.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’Asie, pression sur</text><text x="112.0" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">les prix,</text><text x="112.0" y="290" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">standardisation des</text><text x="112.0" y="307" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">produits.</text><path d="M199.0 214.0 L212.0 214.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M219.0 214.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="224.0" y="110" width="164.0" height="208" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="306" cy="140" r="15" fill="#123A63"/><text x="306.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">2</text><text x="306.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Repositionnement</text><text x="306.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Réassumer la</text><text x="306.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">spécialisation et le</text><text x="306.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">savoir-faire plutôt</text><text x="306.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">que d’affronter les</text><text x="306.0" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">volumes.</text><path d="M393.0 214.0 L406.0 214.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M413.0 214.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="418.0" y="110" width="164.0" height="208" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="500" cy="140" r="15" fill="#123A63"/><text x="500.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">3</text><text x="500.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Produit</text><text x="500.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Renouveler l’offre en</text><text x="500.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">cohérence avec le</text><text x="500.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">positionnement</text><text x="500.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">retenu.</text><path d="M587.0 214.0 L600.0 214.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M607.0 214.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="612.0" y="110" width="164.0" height="208" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="694" cy="140" r="15" fill="#123A63"/><text x="694.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">4</text><text x="694.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Distribution</text><text x="694.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Choisir des circuits</text><text x="694.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">qui portent la valeur</text><text x="694.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">au lieu de l’écraser.</text><path d="M781.0 214.0 L794.0 214.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M801.0 214.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="806.0" y="110" width="164.0" height="208" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="888" cy="140" r="15" fill="#123A63"/><text x="888.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">5</text><text x="888.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Communication</text><text x="888.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Construire le</text><text x="888.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">discours qui rend la</text><text x="888.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">différence visible et</text><text x="888.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">crédible.</text><text x="30" y="342" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">La question posée en ouverture du cours : qu’est-ce qui fait la différence, en communication, dans une entreprise ?</text></svg>