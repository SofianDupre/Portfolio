<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 424" width="1000" height="424" role="img"><rect width="1000" height="424" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Le Pays Haut — le tableau de bord socio-économique</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Un territoire de plus de 240 000 habitants, au contact de quatre pays, marqué par la fin de la sidérurgie et par la dépendance</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">au Luxembourg.</text><rect x="30.0" y="108" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">240 000 habitants</text><text x="181.33333333333334" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le Pays Haut, au nord de la Lorraine, au</text><text x="181.33333333333334" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">contact du Luxembourg, de la Belgique et</text><text x="181.33333333333334" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">de l’Allemagne.</text><rect x="348.6666666666667" y="108" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">10 à 15 % de chômage</text><text x="500.0" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Dans les communes du nord de la</text><text x="500.0" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Meurthe-et-Moselle, au-dessus de la</text><text x="500.0" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">moyenne nationale (INSEE 2022).</text><rect x="667.3333333333334" y="108" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Près d’un actif sur deux</text><text x="818.6666666666667" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Travaille au Luxembourg, ce qui structure</text><text x="818.6666666666667" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">entièrement le marché de l’emploi local.</text><rect x="30.0" y="251" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="269" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="299" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">20 000 € de revenu médian</text><text x="181.33333333333334" y="327" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Par foyer et par an côté français, très en</text><text x="181.33333333333334" y="344" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">deçà des ménages luxembourgeois (INSEE</text><text x="181.33333333333334" y="361" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">2020).</text><rect x="348.6666666666667" y="251" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="269" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="299" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">120 000 frontaliers</text><text x="500.0" y="327" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Traversent la frontière chaque jour,</text><text x="500.0" y="344" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">saturant l’axe Mont-Saint-Martin –</text><text x="500.0" y="361" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Luxembourg.</text><rect x="667.3333333333334" y="251" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="269" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="299" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Des écarts internes</text><text x="818.6666666666667" y="327" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Entre les pôles urbains — Longwy,</text><text x="818.6666666666667" y="344" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Villerupt, Mont-Saint-Martin — et des</text><text x="818.6666666666667" y="361" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">communes rurales isolées.</text><text x="30" y="402" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Sources mobilisées : INSEE, Agence d’urbanisme Nord Lorraine, Observatoire interrégional du marché de l’emploi, STATEC.</text></svg>