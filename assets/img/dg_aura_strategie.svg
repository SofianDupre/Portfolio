<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 308" width="1000" height="308" role="img"><rect width="1000" height="308" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La mise en place stratégique</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Une montée en charge progressive : installer la crédibilité avant de chercher le volume.</text><rect x="30.0" y="110" width="293.3333333333333" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="177" cy="140" r="15" fill="#123A63"/><text x="176.66666666666666" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">1</text><text x="176.66666666666666" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Lancement ciblé</text><text x="176.66666666666666" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Quelques routes premium stratégiques, une</text><text x="176.66666666666666" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">communication fortement digitale, et le</text><text x="176.66666666666666" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">temps de construire une image de marque</text><text x="176.66666666666666" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">avant toute expansion.</text><path d="M328.3333333333333 197.0 L341.3333333333333 197.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M348.3333333333333 197.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="353.3333333333333" y="110" width="293.3333333333333" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="500" cy="140" r="15" fill="#123A63"/><text x="500.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">2</text><text x="500.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Développement communautaire</text><text x="500.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Instagram comme levier central :</text><text x="500.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">interaction avec les abonnés,</text><text x="500.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">valorisation des retours d’expérience,</text><text x="500.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">réponses publiques aux commentaires. Une</text><text x="500.0" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">communauté, pas une base clients.</text><path d="M651.6666666666666 197.0 L664.6666666666666 197.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M671.6666666666666 197.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="676.6666666666666" y="110" width="293.3333333333333" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="823" cy="140" r="15" fill="#123A63"/><text x="823.3333333333333" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">3</text><text x="823.3333333333333" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Renforcement structurel</text><text x="823.3333333333333" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Amélioration continue des processus</text><text x="823.3333333333333" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">internes, pour éviter tout décalage entre</text><text x="823.3333333333333" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">la promesse et le service réellement</text><text x="823.3333333333333" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">rendu.</text></svg>