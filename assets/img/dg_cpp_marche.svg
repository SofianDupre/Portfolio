<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 448" width="1000" height="448" role="img"><rect width="1000" height="448" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Concurrence pure et parfaite : le modèle à l’épreuve du réel</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le point de départ du cours de droit de la concurrence — et le constat qui le justifie.</text><rect x="30" y="108" width="940" height="34" rx="6" fill="#123A63"/><text x="42" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Condition</text><text x="241.75" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Ce qu’elle suppose</text><text x="653.0" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Vérifiée en pratique ?</text><rect x="30" y="142" width="940" height="52" fill="white"/><line x1="30" y1="142" x2="970" y2="142" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Atomicité</text><text x="241.75" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un grand nombre d’offreurs et de demandeurs, dont aucun ne</text><text x="241.75" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">peut influencer le prix à lui seul</text><text x="653.0" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Rarement : la plupart des secteurs sont</text><text x="653.0" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">concentrés</text><rect x="30" y="194" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="194" x2="970" y2="194" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Homogénéité</text><text x="241.75" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Tous les biens d’une même catégorie sont identiques aux</text><text x="241.75" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">yeux des acheteurs</text><text x="653.0" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Non : la différenciation est la norme</text><rect x="30" y="246" width="940" height="52" fill="white"/><line x1="30" y1="246" x2="970" y2="246" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Transparence</text><text x="241.75" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Chef d’entreprise et consommateur disposent de toute</text><text x="241.75" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">l’information utile</text><text x="653.0" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">C’est la seule des cinq réellement vérifiée</text><rect x="30" y="298" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="298" x2="970" y2="298" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Libre entrée et sortie</text><text x="241.75" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un investisseur peut entrer ou quitter un secteur sans</text><text x="241.75" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">obstacle</text><text x="653.0" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Non : barrières de capital, de réglementation,</text><text x="653.0" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">de réputation</text><rect x="30" y="350" width="940" height="52" fill="white"/><line x1="30" y1="350" x2="970" y2="350" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="370" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Mobilité des facteurs</text><text x="241.75" y="370" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Capital et travail se déplacent librement d’une industrie</text><text x="241.75" y="387" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">à l’autre</text><text x="653.0" y="370" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Non : qualifications, localisations et actifs</text><text x="653.0" y="387" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">sont spécifiques</text><rect x="30" y="108" width="940" height="294" rx="6" fill="none" stroke="#DCE5EF" stroke-width="1.5"/><text x="30" y="426" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">C’est parce que le marché ne réalise pas ses propres conditions que le droit de la concurrence existe : ententes, abus de position dominante,</text><text x="30" y="442" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">contrôle des concentrations.</text></svg>