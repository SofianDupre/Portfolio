<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 516" width="1000" height="516" role="img"><rect width="1000" height="516" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Les choix stratégiques après le diagnostic</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Trois familles de décisions qui s’enchaînent : sur quel avantage, vers quelles activités, par quel moyen.</text><rect x="30.0" y="108" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Domination par les coûts</text><text x="181.33333333333334" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Être durablement le moins cher grâce aux</text><text x="181.33333333333334" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">volumes et à l’efficience.</text><rect x="348.6666666666667" y="108" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Différenciation</text><text x="500.0" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Justifier un prix supérieur par une valeur</text><text x="500.0" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">perçue supérieure.</text><rect x="667.3333333333334" y="108" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Focalisation</text><text x="818.6666666666667" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Concentrer l’effort sur une niche mal</text><text x="818.6666666666667" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">servie par les généralistes.</text><rect x="30.0" y="234" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="252" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="282" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Spécialisation</text><text x="181.33333333333334" y="310" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Approfondir un métier unique et en devenir</text><text x="181.33333333333334" y="327" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">la référence.</text><rect x="348.6666666666667" y="234" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="252" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="282" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Diversification</text><text x="500.0" y="310" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Ajouter des activités, liées ou non au</text><text x="500.0" y="327" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">métier d’origine.</text><rect x="667.3333333333334" y="234" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="252" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="282" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Intégration verticale</text><text x="818.6666666666667" y="310" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Remonter vers les fournisseurs ou</text><text x="818.6666666666667" y="327" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">descendre vers la distribution.</text><rect x="30.0" y="360" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="378" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="408" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Croissance interne</text><text x="181.33333333333334" y="436" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Développer par ses propres moyens : lent</text><text x="181.33333333333334" y="453" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">mais maîtrisé.</text><rect x="348.6666666666667" y="360" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="378" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="408" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Croissance externe</text><text x="500.0" y="436" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Acquérir : rapide, coûteux, et risqué sur</text><text x="500.0" y="453" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’intégration.</text><rect x="667.3333333333334" y="360" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="378" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="408" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Alliances</text><text x="818.6666666666667" y="436" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Partager un risque ou une ressource sans</text><text x="818.6666666666667" y="453" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">fusionner.</text><text x="30" y="494" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une stratégie n’échoue presque jamais sur le diagnostic : elle échoue sur le déploiement, la structure et les résistances au changement.</text></svg>