<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 626" width="1000" height="626" role="img"><rect width="1000" height="626" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">MOBILUX — le modèle économique</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">« Un luxe sans bouchons » : une plateforme de mobilité partagée pour les travailleurs frontaliers, portée par une société</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">coopérative d’intérêt collectif.</text><rect x="30.0" y="108" width="304.0" height="166" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="108" width="304" height="26" rx="10" fill="#123A63"/><rect x="30" y="124" width="304" height="10" fill="#123A63"/><text x="44.0" y="126" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">FORME JURIDIQUE</text><circle cx="46" cy="148" r="2.5" fill="#17879E"/><text x="56.0" y="152" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Société coopérative d’intérêt collectif</text><text x="56.0" y="168" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">(SCIC)</text><circle cx="46" cy="188" r="2.5" fill="#17879E"/><text x="56.0" y="192" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Sociétariat ouvert aux salariés, aux</text><text x="56.0" y="208" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">utilisateurs et aux collectivités</text><circle cx="46" cy="228" r="2.5" fill="#17879E"/><text x="56.0" y="232" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Gouvernance démocratique : une personne,</text><text x="56.0" y="248" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">une voix</text><rect x="348.0" y="108" width="304.0" height="166" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="348" y="108" width="304" height="26" rx="10" fill="#123A63"/><rect x="348" y="124" width="304" height="10" fill="#123A63"/><text x="362.0" y="126" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">PROPOSITION DE VALEUR</text><circle cx="364" cy="148" r="2.5" fill="#17879E"/><text x="374.0" y="152" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Réduire le temps de trajet et le stress</text><text x="374.0" y="168" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">quotidien</text><circle cx="364" cy="188" r="2.5" fill="#17879E"/><text x="374.0" y="192" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Faire baisser le coût du transport</text><text x="374.0" y="208" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">individuel</text><circle cx="364" cy="228" r="2.5" fill="#17879E"/><text x="374.0" y="232" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Créer une communauté solidaire entre</text><text x="374.0" y="248" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">frontaliers</text><rect x="666.0" y="108" width="304.0" height="166" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="666" y="108" width="304" height="26" rx="10" fill="#123A63"/><rect x="666" y="124" width="304" height="10" fill="#123A63"/><text x="680.0" y="126" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">BÉNÉFICIAIRES</text><circle cx="682" cy="148" r="2.5" fill="#17879E"/><text x="692.0" y="152" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Les 120 000 frontaliers du bassin</text><circle cx="682" cy="172" r="2.5" fill="#17879E"/><text x="692.0" y="176" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Les habitants du Pays Haut sans solution</text><text x="692.0" y="192" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">de transport</text><circle cx="682" cy="212" r="2.5" fill="#17879E"/><text x="692.0" y="216" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Les entreprises qui proposent le service</text><text x="692.0" y="232" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">à leurs salariés</text><rect x="30.0" y="288" width="304.0" height="134" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="288" width="304" height="26" rx="10" fill="#123A63"/><rect x="30" y="304" width="304" height="10" fill="#123A63"/><text x="44.0" y="306" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">SERVICES</text><circle cx="46" cy="328" r="2.5" fill="#17879E"/><text x="56.0" y="332" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Plateforme numérique de mise en relation</text><circle cx="46" cy="352" r="2.5" fill="#17879E"/><text x="56.0" y="356" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Suivi des trajets en temps réel</text><circle cx="46" cy="376" r="2.5" fill="#17879E"/><text x="56.0" y="380" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Gestion des incidents et modération de la</text><text x="56.0" y="396" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">communauté</text><rect x="348.0" y="288" width="304.0" height="134" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="348" y="288" width="304" height="26" rx="10" fill="#123A63"/><rect x="348" y="304" width="304" height="10" fill="#123A63"/><text x="362.0" y="306" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">SOURCES DE REVENUS</text><circle cx="364" cy="328" r="2.5" fill="#17879E"/><text x="374.0" y="332" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Modèle freemium auprès des utilisateurs</text><circle cx="364" cy="352" r="2.5" fill="#17879E"/><text x="374.0" y="356" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Abonnements entreprises</text><circle cx="364" cy="376" r="2.5" fill="#17879E"/><text x="374.0" y="380" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Partenariats logistiques locaux</text><rect x="666.0" y="288" width="304.0" height="134" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="666" y="288" width="304" height="26" rx="10" fill="#123A63"/><rect x="666" y="304" width="304" height="10" fill="#123A63"/><text x="680.0" y="306" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">FINANCEMENTS PUBLICS</text><circle cx="682" cy="328" r="2.5" fill="#17879E"/><text x="692.0" y="332" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Fonds européens : INTERREG, FEDER</text><circle cx="682" cy="352" r="2.5" fill="#17879E"/><text x="692.0" y="356" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Région Grand Est — mobilité durable et</text><text x="692.0" y="372" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">ESS</text><circle cx="682" cy="392" r="2.5" fill="#17879E"/><text x="692.0" y="396" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">ADEME — transition écologique</text><rect x="30.0" y="436" width="304.0" height="166" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="436" width="304" height="26" rx="10" fill="#123A63"/><rect x="30" y="452" width="304" height="10" fill="#123A63"/><text x="44.0" y="454" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">OPÉRATIONS</text><circle cx="46" cy="476" r="2.5" fill="#17879E"/><text x="56.0" y="480" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Gestion des trajets et des flux</text><text x="56.0" y="496" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">financiers</text><circle cx="46" cy="516" r="2.5" fill="#17879E"/><text x="56.0" y="520" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Gestion administrative de la coopérative</text><circle cx="46" cy="540" r="2.5" fill="#17879E"/><text x="56.0" y="544" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Recrutement et fidélisation de la</text><text x="56.0" y="560" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">communauté</text><rect x="348.0" y="436" width="304.0" height="166" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="348" y="436" width="304" height="26" rx="10" fill="#123A63"/><rect x="348" y="452" width="304" height="10" fill="#123A63"/><text x="362.0" y="454" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">CADRE RÉGLEMENTAIRE</text><circle cx="364" cy="476" r="2.5" fill="#17879E"/><text x="374.0" y="480" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">RGPD : transparence, suppression des</text><text x="374.0" y="496" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">données, sécurisation</text><circle cx="364" cy="516" r="2.5" fill="#17879E"/><text x="374.0" y="520" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Réglementation de la mobilité partagée</text><circle cx="364" cy="540" r="2.5" fill="#17879E"/><text x="374.0" y="544" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Conventionnement avec les collectivités</text><rect x="666.0" y="436" width="304.0" height="166" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="666" y="436" width="304" height="26" rx="10" fill="#123A63"/><rect x="666" y="452" width="304" height="10" fill="#123A63"/><text x="680.0" y="454" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">VIABILITÉ</text><circle cx="682" cy="476" r="2.5" fill="#17879E"/><text x="692.0" y="480" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Montée en puissance progressive du nombre</text><text x="692.0" y="496" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">d’utilisateurs</text><circle cx="682" cy="516" r="2.5" fill="#17879E"/><text x="692.0" y="520" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Freemium complété par les contrats</text><text x="692.0" y="536" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">entreprises</text><circle cx="682" cy="556" r="2.5" fill="#17879E"/><text x="692.0" y="560" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Dispositifs de soutien aux SCIC</text><text x="692.0" y="576" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">émergentes</text></svg>