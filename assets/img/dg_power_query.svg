<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 313" width="1000" height="313" role="img"><rect width="1000" height="313" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Power Query : décrire une transformation plutôt que corriger un fichier</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Chaque étape est enregistrée et rejouée dans l’ordre à chaque actualisation.</text><rect x="30.0" y="110" width="164.0" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="112" cy="140" r="15" fill="#123A63"/><text x="112.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">1</text><text x="112.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Connecter</text><text x="112.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Classeurs, dossiers</text><text x="112.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">entiers, fichiers</text><text x="112.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">texte, bases de</text><text x="112.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">données.</text><path d="M199.0 188.5 L212.0 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M219.0 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="224.0" y="110" width="164.0" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="306" cy="140" r="15" fill="#123A63"/><text x="306.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">2</text><text x="306.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Nettoyer</text><text x="306.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Types, colonnes</text><text x="306.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">superflues, en-têtes,</text><text x="306.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">valeurs manquantes et</text><text x="306.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">erreurs.</text><path d="M393.0 188.5 L406.0 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M413.0 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="418.0" y="110" width="164.0" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="500" cy="140" r="15" fill="#123A63"/><text x="500.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">3</text><text x="500.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Transformer</text><text x="500.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Fractionner,</text><text x="500.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">fusionner, pivoter et</text><text x="500.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">dépivoter des</text><text x="500.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">colonnes.</text><path d="M587.0 188.5 L600.0 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M607.0 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="612.0" y="110" width="164.0" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="694" cy="140" r="15" fill="#123A63"/><text x="694.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">4</text><text x="694.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Combiner</text><text x="694.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Ajouter des lignes ou</text><text x="694.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">fusionner par clé —</text><text x="694.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’équivalent d’une</text><text x="694.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">jointure.</text><path d="M781.0 188.5 L794.0 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M801.0 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="806.0" y="110" width="164.0" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="888" cy="140" r="15" fill="#123A63"/><text x="888.0" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">5</text><text x="888.0" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Charger</text><text x="888.0" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Vers un tableau</text><text x="888.0" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">croisé dynamique,</text><text x="888.0" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">actualisable d’un</text><text x="888.0" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">clic.</text><text x="30" y="291" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le gain réel : une consolidation mensuelle se construit une fois et se rejoue ensuite en quelques secondes.</text></svg>