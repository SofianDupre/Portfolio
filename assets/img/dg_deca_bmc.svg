<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img"><rect width="1000" height="680" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Decathlon — le Business Model Canvas appliqué au management de projet</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Outil de conception et de communication d’un modèle économique (Osterwalder et Pigneur, 2008). Appliqué au projet, il sert à</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">structurer, coordonner et piloter.</text><rect x="30.0" y="108" width="304.0" height="174" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="108" width="304" height="26" rx="10" fill="#123A63"/><rect x="30" y="124" width="304" height="10" fill="#123A63"/><text x="44.0" y="126" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">SEGMENTS DE CLIENTÈLE</text><circle cx="46" cy="148" r="2.5" fill="#17879E"/><text x="56.0" y="152" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Sportifs amateurs et confirmés</text><circle cx="46" cy="172" r="2.5" fill="#17879E"/><text x="56.0" y="176" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Familles, écoles et associations</text><circle cx="46" cy="196" r="2.5" fill="#17879E"/><text x="56.0" y="200" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Équipes internes : ingénieurs, chefs de</text><text x="56.0" y="216" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">projet, designers</text><circle cx="46" cy="236" r="2.5" fill="#17879E"/><text x="56.0" y="240" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Partenaires externes : fournisseurs,</text><text x="56.0" y="256" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">transporteurs, start-ups</text><rect x="348.0" y="108" width="304.0" height="174" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="348" y="108" width="304" height="26" rx="10" fill="#123A63"/><rect x="348" y="124" width="304" height="10" fill="#123A63"/><text x="362.0" y="126" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">PROPOSITION DE VALEUR</text><circle cx="364" cy="148" r="2.5" fill="#17879E"/><text x="374.0" y="152" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Des produits innovants et accessibles</text><circle cx="364" cy="172" r="2.5" fill="#17879E"/><text x="374.0" y="176" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Des méthodes de projet agiles et</text><text x="374.0" y="192" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">collaboratives</text><circle cx="364" cy="212" r="2.5" fill="#17879E"/><text x="374.0" y="216" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Des projets durables : réparabilité,</text><text x="374.0" y="232" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">recyclage, économie circulaire</text><rect x="666.0" y="108" width="304.0" height="174" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="666" y="108" width="304" height="26" rx="10" fill="#123A63"/><rect x="666" y="124" width="304" height="10" fill="#123A63"/><text x="680.0" y="126" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">CANAUX</text><circle cx="682" cy="148" r="2.5" fill="#17879E"/><text x="692.0" y="152" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Outils numériques de gestion de projet</text><circle cx="682" cy="172" r="2.5" fill="#17879E"/><text x="692.0" y="176" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Workshops collaboratifs, design sprints</text><circle cx="682" cy="196" r="2.5" fill="#17879E"/><text x="692.0" y="200" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Magasins, site de vente en ligne,</text><text x="692.0" y="216" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">application mobile</text><rect x="30.0" y="296" width="304.0" height="166" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="296" width="304" height="26" rx="10" fill="#123A63"/><rect x="30" y="312" width="304" height="10" fill="#123A63"/><text x="44.0" y="314" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">RELATIONS CLIENTS</text><circle cx="46" cy="336" r="2.5" fill="#17879E"/><text x="56.0" y="340" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Co-création et tests utilisateurs</text><circle cx="46" cy="360" r="2.5" fill="#17879E"/><text x="56.0" y="364" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Retours intégrés dans les boucles projet</text><circle cx="46" cy="384" r="2.5" fill="#17879E"/><text x="56.0" y="388" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Plateformes participatives</text><rect x="348.0" y="296" width="304.0" height="166" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="348" y="296" width="304" height="26" rx="10" fill="#123A63"/><rect x="348" y="312" width="304" height="10" fill="#123A63"/><text x="362.0" y="314" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">FLUX DE REVENUS</text><circle cx="364" cy="336" r="2.5" fill="#17879E"/><text x="374.0" y="340" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Ventes des produits issus des projets</text><text x="374.0" y="356" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">innovants</text><circle cx="364" cy="376" r="2.5" fill="#17879E"/><text x="374.0" y="380" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Services : location, réparation, seconde</text><text x="374.0" y="396" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">vie</text><circle cx="364" cy="416" r="2.5" fill="#17879E"/><text x="374.0" y="420" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Efficacité accrue par la bonne gestion de</text><text x="374.0" y="436" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">projet</text><rect x="666.0" y="296" width="304.0" height="166" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="666" y="296" width="304" height="26" rx="10" fill="#123A63"/><rect x="666" y="312" width="304" height="10" fill="#123A63"/><text x="680.0" y="314" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">RESSOURCES CLÉS</text><circle cx="682" cy="336" r="2.5" fill="#17879E"/><text x="692.0" y="340" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Équipes projet pluridisciplinaires</text><circle cx="682" cy="360" r="2.5" fill="#17879E"/><text x="692.0" y="364" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Méthodes agiles et lean</text><circle cx="682" cy="384" r="2.5" fill="#17879E"/><text x="692.0" y="388" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Infrastructures de recherche et de test</text><circle cx="682" cy="408" r="2.5" fill="#17879E"/><text x="692.0" y="412" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Culture d’autonomie et de</text><text x="692.0" y="428" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">responsabilisation</text><rect x="30.0" y="476" width="304.0" height="158" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="476" width="304" height="26" rx="10" fill="#123A63"/><rect x="30" y="492" width="304" height="10" fill="#123A63"/><text x="44.0" y="494" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">ACTIVITÉS CLÉS</text><circle cx="46" cy="516" r="2.5" fill="#17879E"/><text x="56.0" y="520" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Conception, prototypage et test produit</text><circle cx="46" cy="540" r="2.5" fill="#17879E"/><text x="56.0" y="544" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Planification et suivi : feuilles de</text><text x="56.0" y="560" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">route, indicateurs, revues</text><circle cx="46" cy="580" r="2.5" fill="#17879E"/><text x="56.0" y="584" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Coordination entre les équipes</text><circle cx="46" cy="604" r="2.5" fill="#17879E"/><text x="56.0" y="608" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Formation continue au management agile</text><rect x="348.0" y="476" width="304.0" height="158" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="348" y="476" width="304" height="26" rx="10" fill="#123A63"/><rect x="348" y="492" width="304" height="10" fill="#123A63"/><text x="362.0" y="494" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">PARTENAIRES CLÉS</text><circle cx="364" cy="516" r="2.5" fill="#17879E"/><text x="374.0" y="520" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Fournisseurs intégrés dès la conception</text><circle cx="364" cy="540" r="2.5" fill="#17879E"/><text x="374.0" y="544" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Start-ups technologiques, universités,</text><text x="374.0" y="560" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">laboratoires</text><circle cx="364" cy="580" r="2.5" fill="#17879E"/><text x="374.0" y="584" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Associations sportives et partenaires</text><text x="374.0" y="600" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">logistiques</text><rect x="666.0" y="476" width="304.0" height="158" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="666" y="476" width="304" height="26" rx="10" fill="#123A63"/><rect x="666" y="492" width="304" height="10" fill="#123A63"/><text x="680.0" y="494" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">STRUCTURE DE COÛTS</text><circle cx="682" cy="516" r="2.5" fill="#17879E"/><text x="692.0" y="520" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Investissements en recherche et</text><text x="692.0" y="536" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">innovation</text><circle cx="682" cy="556" r="2.5" fill="#17879E"/><text x="692.0" y="560" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Formation à la gestion de projet</text><circle cx="682" cy="580" r="2.5" fill="#17879E"/><text x="692.0" y="584" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Outils numériques collaboratifs</text><circle cx="682" cy="604" r="2.5" fill="#17879E"/><text x="692.0" y="608" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Logistique, marketing, transition durable</text><text x="30" y="658" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Les neuf blocs du canvas rendu, redessinés dans la charte du portfolio.</text></svg>