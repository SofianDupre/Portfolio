<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 677" width="1000" height="677" role="img"><rect width="1000" height="677" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Le secteur immobilier — les cinq forces de Porter</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Immobilier global : résidentiel, tertiaire et investissement. Le modèle mesure l’intensité concurrentielle du marché et la</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">rentabilité que l’on peut en attendre.</text><rect x="30" y="108" width="940" height="95" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="108" width="5" height="95" rx="2.5" fill="#B3543A"/><text x="50" y="134" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="start">Rivalité entre les concurrents</text><rect x="820" y="120" width="132" height="24" rx="12" fill="#B3543A" fill-opacity="0.12"/><text x="886" y="136" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="#B3543A" text-anchor="middle">TRÈS FORTE</text><text x="50" y="154" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un marché fragmenté : réseaux d’agences, promoteurs nationaux et indépendants locaux, pour des services peu</text><text x="50" y="171" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">différenciés — achat, vente, location, estimation. Forte pression sur les honoraires et sur les délais,</text><text x="50" y="188" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">accentuée par les plateformes d’annonces qui réduisent l’intermédiation.</text><rect x="30" y="215" width="940" height="95" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="215" width="5" height="95" rx="2.5" fill="#C07A2B"/><text x="50" y="241" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="start">Pouvoir de négociation des clients</text><rect x="820" y="227" width="132" height="24" rx="12" fill="#C07A2B" fill-opacity="0.12"/><text x="886" y="243" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="#C07A2B" text-anchor="middle">ÉLEVÉ</text><text x="50" y="261" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Acheteurs, vendeurs, investisseurs et locataires accèdent librement aux prix, aux tendances et aux</text><text x="50" y="278" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">simulateurs. Ils comparent les offres, négocient les commissions et exigent transparence, rapidité et</text><text x="50" y="295" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">accompagnement sur mesure.</text><rect x="30" y="322" width="940" height="95" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="322" width="5" height="95" rx="2.5" fill="#8A7524"/><text x="50" y="348" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="start">Pouvoir de négociation des fournisseurs</text><rect x="820" y="334" width="132" height="24" rx="12" fill="#8A7524" fill-opacity="0.12"/><text x="886" y="350" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="#8A7524" text-anchor="middle">MOYEN</text><text x="50" y="368" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">BTP, architectes, notaires, banques, courtiers et plateformes d’annonces. Le pouvoir est fort côté</text><text x="50" y="385" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">construction — hausse du prix des matériaux, tension sur la main-d’œuvre — et reste modéré côté services, où</text><text x="50" y="402" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">les alternatives abondent.</text><rect x="30" y="429" width="940" height="95" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="429" width="5" height="95" rx="2.5" fill="#C07A2B"/><text x="50" y="455" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="start">Menace des nouveaux entrants</text><rect x="820" y="441" width="132" height="24" rx="12" fill="#C07A2B" fill-opacity="0.12"/><text x="886" y="457" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="#C07A2B" text-anchor="middle">MOYENNE À FORTE</text><text x="50" y="475" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">La digitalisation abaisse les barrières : mandataires indépendants, agences en ligne à commission réduite,</text><text x="50" y="492" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">spécialisation sur des niches. Subsistent la loi Hoguet, la carte professionnelle, les garanties financières</text><text x="50" y="509" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">et le besoin d’un réseau local solide.</text><rect x="30" y="536" width="940" height="95" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="536" width="5" height="95" rx="2.5" fill="#8A7524"/><text x="50" y="562" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="start">Menace des produits de substitution</text><rect x="820" y="548" width="132" height="24" rx="12" fill="#8A7524" fill-opacity="0.12"/><text x="886" y="564" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="#8A7524" text-anchor="middle">MOYENNE</text><text x="50" y="582" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">La désintermédiation progresse : vente directe entre particuliers, crowdfunding immobilier, coliving, habitat</text><text x="50" y="599" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">modulaire. La visite virtuelle, l’estimation par intelligence artificielle et la blockchain déplacent le rôle</text><text x="50" y="616" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">de l’intermédiaire.</text><text x="30" y="655" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Lecture : plus la force est intense, plus elle pèse sur la rentabilité du secteur.</text></svg>