<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img"><rect width="1000" height="380" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La dématérialisation des bons de travail</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Ce que le passage du papier au numérique change concrètement pour les équipes de terrain.</text><rect x="30" y="108" width="940" height="34" rx="6" fill="#123A63"/><text x="42" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start"></text><text x="263.1764705882353" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Aujourd’hui</text><text x="594.9411764705883" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Après le projet</text><rect x="30" y="142" width="940" height="52" fill="white"/><line x1="30" y1="142" x2="970" y2="142" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Signalement d’incident</text><text x="263.1764705882353" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Par téléphone ou sur support papier</text><text x="594.9411764705883" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Depuis l’application mobile du conducteur, en temps</text><text x="594.9411764705883" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">réel</text><rect x="30" y="194" width="940" height="35" fill="#F4F7FA"/><line x1="30" y1="194" x2="970" y2="194" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Compte rendu</text><text x="263.1764705882353" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Non standardisé, d’un agent à l’autre</text><text x="594.9411764705883" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Formulaire unique, transmis et horodaté</text><rect x="30" y="229" width="940" height="35" fill="white"/><line x1="30" y1="229" x2="970" y2="229" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="249" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Traçabilité</text><text x="263.1764705882353" y="249" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Partielle, dispersée entre plusieurs supports</text><text x="594.9411764705883" y="249" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Centralisée dans un système d’information unique</text><rect x="30" y="264" width="940" height="35" fill="#F4F7FA"/><line x1="30" y1="264" x2="970" y2="264" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="284" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Priorisation</text><text x="263.1764705882353" y="284" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Au jugement, sans vue d’ensemble</text><text x="594.9411764705883" y="284" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Par la file d’interventions, alimentée en continu</text><rect x="30" y="299" width="940" height="35" fill="white"/><line x1="30" y1="299" x2="970" y2="299" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="319" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Pilotage</text><text x="263.1764705882353" y="319" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Peu de données exploitables</text><text x="594.9411764705883" y="319" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Tableaux de bord et reporting automatisé</text><rect x="30" y="108" width="940" height="226" rx="6" fill="none" stroke="#DCE5EF" stroke-width="1.5"/><text x="30" y="358" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">L’accompagnement prévu : formations progressives, supports pédagogiques, désignation d’un référent numérique et période de transition où les</text><text x="30" y="374" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">deux outils coexistent.</text></svg>