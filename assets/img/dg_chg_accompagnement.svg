<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 308" width="1000" height="308" role="img"><rect width="1000" height="308" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">L’ingénierie de l’accompagnement</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Quatre leviers pour que le pivot se traduise dans les pratiques, et pas seulement dans un document.</text><rect x="30.0" y="110" width="212.5" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="136" cy="140" r="15" fill="#123A63"/><text x="136.25" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">1</text><text x="136.25" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Former</text><text x="136.25" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Compétences techniques —</text><text x="136.25" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">examens approfondis, basse</text><text x="136.25" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">vision, lentilles complexes,</text><text x="136.25" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">suivi post-opératoire —,</text><text x="136.25" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">relationnelles et digitales.</text><path d="M247.5 197.0 L260.5 197.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M267.5 197.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="272.5" y="110" width="212.5" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="379" cy="140" r="15" fill="#123A63"/><text x="378.75" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">2</text><text x="378.75" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Donner du sens</text><text x="378.75" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le Golden Circle appliqué à</text><text x="378.75" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">la communication interne,</text><text x="378.75" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">avec des points réguliers</text><text x="378.75" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">pour maintenir la</text><text x="378.75" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">transparence.</text><path d="M490.0 197.0 L503.0 197.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M510.0 197.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="515.0" y="110" width="212.5" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="621" cy="140" r="15" fill="#123A63"/><text x="621.25" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">3</text><text x="621.25" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Co-construire</text><text x="621.25" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Ateliers d’idéation, boîte à</text><text x="621.25" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">idées, réunions</text><text x="621.25" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">participatives et un référent</text><text x="621.25" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">interne du projet.</text><path d="M732.5 197.0 L745.5 197.0" stroke="#17879E" stroke-width="2" fill="none"/><path d="M752.5 197.0 l-7 -5 l0 10 z" fill="#17879E"/><rect x="757.5" y="110" width="212.5" height="174" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="864" cy="140" r="15" fill="#123A63"/><text x="863.75" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">4</text><text x="863.75" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Piloter</text><text x="863.75" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Un chronogramme, des</text><text x="863.75" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">indicateurs, des outils de</text><text x="863.75" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">retour et des victoires</text><text x="863.75" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">rapides pour entretenir la</text><text x="863.75" y="273" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">dynamique.</text></svg>