<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 298" width="1000" height="298" role="img"><rect width="1000" height="298" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Quatre pistes de création, une retenue</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">L’objet de la SAÉ : passer du diagnostic à une proposition de développement argumentée.</text><rect x="30.0" y="108" width="223.0" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="124" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="141.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Bien-être et évasion</text><text x="141.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Spa aux minéraux de la région,</text><text x="141.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">rooftop détente avec vue sur</text><text x="141.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">les fortifications, forfaits</text><text x="141.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">déconnexion sans écran.</text><rect x="269.0" y="108" width="223.0" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="364" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="380.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Expérience technologique</text><text x="380.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Chambres connectées pilotées</text><text x="380.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">par application, application</text><text x="380.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">de séjour, espace de coworking</text><text x="380.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">pour les professionnels.</text><rect x="508.0" y="108" width="223.0" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="602" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="619.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Personnalisation</text><text x="619.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Conciergerie numérique</text><text x="619.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">apprenant les préférences des</text><text x="619.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">clients, chambres thématiques.</text><rect x="747.0" y="108" width="223.0" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="842" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="858.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Patrimoine local</text><text x="858.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Visite des fortifications en</text><text x="858.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">réalité augmentée, ateliers</text><text x="858.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">d’émaux, séjour thématique</text><text x="858.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Vauban avec repas historique.</text><text x="30" y="276" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Piste retenue : le patrimoine local. Elle s’appuie sur ce que Longwy a d’unique, ne demande pas d’investissement lourd, et se combine bien</text><text x="30" y="292" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">avec le rooftop bien-être de la première piste.</text></svg>