<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 276" width="1000" height="276" role="img"><rect width="1000" height="276" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Le choix de la méthode de gestion de projet</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Deux méthodes étaient envisageables. La comparaison a tranché.</text><rect x="30.0" y="108" width="462.0" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="244" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="261.0" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Le cycle en V</text><text x="261.0" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Une planification rigide et une forte formalisation. Rassurant sur</text><text x="261.0" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">le papier, mais difficile à faire évoluer une fois le cahier des</text><text x="261.0" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">charges figé.</text><rect x="508.0" y="108" width="462.0" height="144" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="722" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="739.0" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">La méthode Agile</text><text x="739.0" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Des cycles courts, des tests réguliers et les retours des</text><text x="739.0" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">utilisateurs intégrés tout au long du projet. Retenue, parce que</text><text x="739.0" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">le projet dépend de ce que les conducteurs et les équipes de</text><text x="739.0" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">terrain remontent.</text></svg>