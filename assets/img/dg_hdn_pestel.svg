<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 521" width="1000" height="521" role="img"><rect width="1000" height="521" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Hôtel du Nord — l’analyse PESTEL</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Les six dimensions de l’environnement d’un hôtel indépendant à Longwy, ville à la croisée de trois frontières.</text><rect x="30.0" y="108" width="302.6666666666667" height="195" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Politique</text><text x="181.33333333333334" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Normes de sécurité, d’hygiène et de</text><text x="181.33333333333334" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">tourisme françaises et européennes.</text><text x="181.33333333333334" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Relations stables avec le Luxembourg et la</text><text x="181.33333333333334" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Belgique, favorables au tourisme</text><text x="181.33333333333334" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">transfrontalier. Subventions locales</text><text x="181.33333333333334" y="269" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">mobilisables pour la rénovation du</text><text x="181.33333333333334" y="286" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">patrimoine.</text><rect x="348.6666666666667" y="108" width="302.6666666666667" height="195" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Économique</text><text x="500.0" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">La conjoncture régionale et européenne</text><text x="500.0" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">pèse sur la demande touristique. La</text><text x="500.0" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">proximité luxembourgeoise et belge apporte</text><text x="500.0" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">des visiteurs réguliers. L’évolution du</text><text x="500.0" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">pouvoir d’achat commande la fréquentation.</text><rect x="667.3333333333334" y="108" width="302.6666666666667" height="195" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Socioculturel</text><text x="818.6666666666667" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Intérêt croissant pour le tourisme local</text><text x="818.6666666666667" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">et culturel et pour les expériences</text><text x="818.6666666666667" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">authentiques. Vieillissement de la</text><text x="818.6666666666667" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">population : une clientèle senior à</text><text x="818.6666666666667" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">capter. Sensibilité écologique en hausse.</text><rect x="30.0" y="319" width="302.6666666666667" height="178" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="337" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="367" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Technologique</text><text x="181.33333333333334" y="395" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">La réservation en ligne et les avis</text><text x="181.33333333333334" y="412" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">clients déterminent la fréquentation.</text><text x="181.33333333333334" y="429" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Attente de services numériques — paiement</text><text x="181.33333333333334" y="446" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">sans contact, enregistrement</text><text x="181.33333333333334" y="463" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">dématérialisé. Marketing digital et</text><text x="181.33333333333334" y="480" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">réseaux sociaux.</text><rect x="348.6666666666667" y="319" width="302.6666666666667" height="178" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="337" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="367" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Environnemental</text><text x="500.0" y="395" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Demande d’un hébergement écoresponsable.</text><text x="500.0" y="412" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Normes de gestion de l’énergie, de l’eau</text><text x="500.0" y="429" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">et des déchets. Le changement climatique</text><text x="500.0" y="446" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">déplace la saisonnalité touristique.</text><rect x="667.3333333333334" y="319" width="302.6666666666667" height="178" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="337" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="367" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Légal</text><text x="818.6666666666667" y="395" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Droit du travail français : salaires,</text><text x="818.6666666666667" y="412" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">temps de travail. Législation touristique,</text><text x="818.6666666666667" y="429" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">taxes de séjour, restrictions sanitaires</text><text x="818.6666666666667" y="446" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">éventuelles. Protection des offres</text><text x="818.6666666666667" y="463" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">développées autour du patrimoine.</text></svg>