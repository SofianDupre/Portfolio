<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img"><rect width="1000" height="420" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Lire un bulletin de paie, ligne par ligne</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">La structure travaillée sur logiciel métier : comprendre avant de produire.</text><rect x="30" y="108" width="940" height="42" rx="8" fill="#17879E"/><text x="46.0" y="135" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">Salaire brut</text><text x="954.0" y="135" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">base, heures supplémentaires, primes</text><path d="M500 152 l-6 0 l6 10 l6 -10 z" fill="#DCE5EF"/><rect x="56" y="164" width="888" height="42" rx="8" fill="#123A63"/><text x="71.85000000000002" y="191" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">− Cotisations salariales</text><text x="928.15" y="191" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">maladie, retraite, chômage, CSG et CRDS</text><path d="M500 208 l-6 0 l6 10 l6 -10 z" fill="#DCE5EF"/><rect x="82" y="220" width="837" height="42" rx="8" fill="#17879E"/><text x="97.69999999999999" y="247" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">= Net social</text><text x="902.3" y="247" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">montant de référence des prestations sociales</text><path d="M500 264 l-6 0 l6 10 l6 -10 z" fill="#DCE5EF"/><rect x="108" y="276" width="785" height="42" rx="8" fill="#123A63"/><text x="123.55000000000001" y="303" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">− Prélèvement à la source</text><text x="876.45" y="303" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">taux transmis par l’administration fiscale</text><path d="M500 320 l-6 0 l6 10 l6 -10 z" fill="#DCE5EF"/><rect x="133" y="332" width="733" height="42" rx="8" fill="#17879E"/><text x="149.39999999999998" y="359" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="start">= Net à payer</text><text x="850.6" y="359" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="white" text-anchor="end">le seul chiffre que le salarié regarde vraiment</text><text x="30" y="398" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">À côté du brut figurent les cotisations patronales, qui n’apparaissent pas dans le net mais constituent le coût réel de l’emploi pour</text><text x="30" y="414" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">l’employeur.</text></svg>