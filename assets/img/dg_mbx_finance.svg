<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img"><rect width="1000" height="500" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La synthèse financière du projet</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Fourchette basse et fourchette haute, telles qu’elles figurent au dossier.</text><line x1="30" y1="350" x2="970" y2="350" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="202" width="218" height="148" rx="5" fill="#17879E"/><text x="139.25" y="190.34138972809666" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="#123A63" text-anchor="middle">42 500 €</text><text x="139.25" y="386" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Coûts initiaux — bas</text><text x="139.25" y="410" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">installation, plateforme,</text><text x="139.25" y="426" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">communication</text><rect x="270" y="168" width="218" height="182" rx="5" fill="#17879E"/><text x="379.75" y="155.59818731117824" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="#123A63" text-anchor="middle">52 500 €</text><text x="379.75" y="386" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Coûts initiaux — haut</text><text x="379.75" y="410" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">hypothèse prudente</text><rect x="511" y="165" width="218" height="185" rx="5" fill="#17879E"/><text x="620.25" y="153.16616314199396" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="#123A63" text-anchor="middle">53 200 €</text><text x="620.25" y="386" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Revenus prévisionnels — bas</text><text x="620.25" y="410" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">freemium et abonnements entreprises</text><rect x="752" y="120" width="218" height="230" rx="5" fill="#17879E"/><text x="860.75" y="108.0" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="#123A63" text-anchor="middle">66 200 €</text><text x="860.75" y="386" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Revenus prévisionnels — haut</text><text x="860.75" y="410" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">avec subventions obtenues</text><text x="30" y="478" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Même en croisant la fourchette haute des coûts et la fourchette basse des revenus, le projet reste à l’équilibre.</text></svg>