<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 312" width="1000" height="312" role="img"><rect width="1000" height="312" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Le cas France Télécom</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le fil rouge du cours de psychologie sociale sur les risques psychosociaux.</text><line x1="140" y1="152" x2="860" y2="152" stroke="#DCE5EF" stroke-width="2.5"/><circle cx="140" cy="152" r="9" fill="#17879E"/><text x="140.5" y="130" font-family="Poppins, Lato, sans-serif" font-size="15" font-weight="700" fill="#123A63" text-anchor="middle">2005</text><text x="140.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Arrivée d’un nouveau PDG, Didier</text><text x="140.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Lombard, et lancement du</text><text x="140.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">programme NEXT.</text><circle cx="380" cy="152" r="9" fill="#17879E"/><text x="380.16666666666663" y="130" font-family="Poppins, Lato, sans-serif" font-size="15" font-weight="700" fill="#123A63" text-anchor="middle">2006-2008</text><text x="380.16666666666663" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">16 000 postes supprimés et 10 000</text><text x="380.16666666666663" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">mutations imposées.</text><circle cx="620" cy="152" r="9" fill="#17879E"/><text x="619.8333333333333" y="130" font-family="Poppins, Lato, sans-serif" font-size="15" font-weight="700" fill="#123A63" text-anchor="middle">2008-2009</text><text x="619.8333333333333" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">34 salariés se suicident à la</text><text x="619.8333333333333" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">suite de situations de souffrance</text><text x="619.8333333333333" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">au travail.</text><circle cx="860" cy="152" r="9" fill="#17879E"/><text x="859.5" y="130" font-family="Poppins, Lato, sans-serif" font-size="15" font-weight="700" fill="#123A63" text-anchor="middle">Depuis</text><text x="859.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">L’affaire fait référence en</text><text x="859.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">matière de responsabilité de</text><text x="859.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’employeur et de prévention des</text><text x="859.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">RPS.</text><text x="30" y="290" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Trois niveaux de prévention : primaire, en agissant sur l’organisation du travail ; secondaire, en formant et en outillant les salariés ;</text><text x="30" y="306" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">tertiaire, en prenant en charge les personnes en difficulté.</text></svg>