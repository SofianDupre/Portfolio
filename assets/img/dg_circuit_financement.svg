<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 313" width="1000" height="313" role="img"><rect width="1000" height="313" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Le financement de l’économie : deux circuits</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Les agents à capacité de financement rencontrent ceux qui ont un besoin de financement, soit directement sur les marchés, soit</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">par l’intermédiaire des banques.</text><rect x="30.0" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="136" cy="140" r="15" fill="#123A63"/><text x="136.25" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">1</text><text x="136.25" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Capacités de financement</text><text x="136.25" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Les ménages épargnent : S = Y</text><text x="136.25" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">− C. La part épargnée du</text><text x="136.25" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">revenu alimente le</text><text x="136.25" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">financement de l’économie.</text><path d="M247.5 188.5 L260.5 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M267.5 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="272.5" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="379" cy="140" r="15" fill="#123A63"/><text x="378.75" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">2</text><text x="378.75" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Financement direct</text><text x="378.75" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Deux agents s’entendent par</text><text x="378.75" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’entremise des marchés de</text><text x="378.75" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">capitaux : achat d’actions,</text><text x="378.75" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">d’obligations, de titres.</text><path d="M490.0 188.5 L503.0 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M510.0 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="515.0" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="621" cy="140" r="15" fill="#123A63"/><text x="621.25" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">3</text><text x="621.25" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Financement indirect</text><text x="621.25" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Relation triangulaire : les</text><text x="621.25" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">établissements de crédit</text><text x="621.25" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">collectent les dépôts et</text><text x="621.25" y="256" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">accordent les crédits.</text><path d="M732.5 188.5 L745.5 188.5" stroke="#17879E" stroke-width="2" fill="none"/><path d="M752.5 188.5 l-7 -5 l0 10 z" fill="#17879E"/><rect x="757.5" y="110" width="212.5" height="157" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="864" cy="140" r="15" fill="#123A63"/><text x="863.75" y="145" font-family="Poppins, Lato, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">4</text><text x="863.75" y="178" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Besoins de financement</text><text x="863.75" y="205" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">L’État et les entreprises</text><text x="863.75" y="222" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">investissent au-delà de leur</text><text x="863.75" y="239" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">épargne propre.</text><text x="30" y="291" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le crédit constitue le processus de création monétaire : la banque centrale mesure en permanence cette croissance et contrôle la quantité de</text><text x="30" y="307" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">monnaie en circulation.</text></svg>