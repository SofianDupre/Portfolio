<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" width="1000" height="548" role="img"><rect width="1000" height="548" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Le processus de prospection, de bout en bout</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Ce que la matière enseigne, au fond : la prospection est un processus qui se prépare, se mesure et se corrige — pas un talent</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">que l’on aurait ou non.</text><rect x="30.0" y="108" width="302.6666666666667" height="189" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="108" width="303" height="28" rx="10" fill="#123A63"/><rect x="30" y="124" width="303" height="12" fill="#123A63"/><text x="45.0" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">1. CIBLER ET PRÉPARER</text><circle cx="46" cy="152" r="2.5" fill="#17879E"/><text x="57.0" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Identifier le client idéal : secteur,</text><text x="57.0" y="173" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">taille, besoin</text><circle cx="46" cy="195" r="2.5" fill="#17879E"/><text x="57.0" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Créer un fichier qualifié, avec les</text><text x="57.0" y="216" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">décideurs</text><circle cx="46" cy="238" r="2.5" fill="#17879E"/><text x="57.0" y="242" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Segmenter pour prioriser les prospects</text><rect x="348.6666666666667" y="108" width="302.6666666666667" height="189" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="349" y="108" width="303" height="28" rx="10" fill="#123A63"/><rect x="349" y="124" width="303" height="12" fill="#123A63"/><text x="363.6666666666667" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">2. CHOISIR LES CANAUX</text><circle cx="365" cy="152" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Multicanal : téléphone, e-mail,</text><text x="375.6666666666667" y="173" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">LinkedIn, visites</text><circle cx="365" cy="195" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un objectif unique : obtenir un</text><text x="375.6666666666667" y="216" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">rendez-vous</text><circle cx="365" cy="238" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="242" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un script simple, connu mais non récité</text><rect x="667.3333333333334" y="108" width="302.6666666666667" height="189" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="667" y="108" width="303" height="28" rx="10" fill="#123A63"/><rect x="667" y="124" width="303" height="12" fill="#123A63"/><text x="682.3333333333334" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">3. CONTACTER</text><circle cx="683" cy="152" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Accroche, but de l’appel, découverte,</text><text x="694.3333333333334" y="173" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">valeur, rendez-vous</text><circle cx="683" cy="195" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Écoute active et adaptation au fil de</text><text x="694.3333333333334" y="216" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">l’échange</text><circle cx="683" cy="238" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="242" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Passer l’accueil en montrant la valeur</text><text x="694.3333333333334" y="259" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">de l’appel</text><rect x="30.0" y="313" width="302.6666666666667" height="189" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="313" width="303" height="28" rx="10" fill="#123A63"/><rect x="30" y="329" width="303" height="12" fill="#123A63"/><text x="45.0" y="332" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">4. GÉRER LES OBJECTIONS</text><circle cx="46" cy="357" r="2.5" fill="#17879E"/><text x="57.0" y="361" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Écouter et reformuler</text><circle cx="46" cy="383" r="2.5" fill="#17879E"/><text x="57.0" y="387" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Répondre de manière concise</text><circle cx="46" cy="409" r="2.5" fill="#17879E"/><text x="57.0" y="413" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Relancer vers la prise de rendez-vous</text><rect x="348.6666666666667" y="313" width="302.6666666666667" height="189" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="349" y="313" width="303" height="28" rx="10" fill="#123A63"/><rect x="349" y="329" width="303" height="12" fill="#123A63"/><text x="363.6666666666667" y="332" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">5. CONCLURE</text><circle cx="365" cy="357" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="361" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Proposer deux ou trois créneaux précis</text><circle cx="365" cy="383" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="387" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Envoyer une confirmation par courriel</text><text x="375.6666666666667" y="404" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">ou par agenda</text><rect x="667.3333333333334" y="313" width="302.6666666666667" height="189" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="667" y="313" width="303" height="28" rx="10" fill="#123A63"/><rect x="667" y="329" width="303" height="12" fill="#123A63"/><text x="682.3333333333334" y="332" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">6. SUIVRE</text><circle cx="683" cy="357" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="361" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Relancer quand ce n’était ni le bon</text><text x="694.3333333333334" y="378" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">moment ni la bonne personne</text><circle cx="683" cy="400" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="404" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Tenir le fichier de suivi à jour, sans</text><text x="694.3333333333334" y="421" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">exception</text><circle cx="683" cy="443" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="447" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Mesurer : taux de contact, taux de</text><text x="694.3333333333334" y="464" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">rendez-vous, taux de transformation</text><text x="30" y="526" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Appliqué en stage chez Partnaire : 125 entreprises prospectées en quatre semaines, cinq retours positifs et un rendez-vous commercial</text><text x="30" y="542" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">décroché.</text></svg>