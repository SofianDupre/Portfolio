<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 293" width="1000" height="293" role="img"><rect width="1000" height="293" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">L’analyse de la concurrence</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Trois cercles, dont un que l’on oublie souvent : les plateformes, qui ne sont pas des hôtels mais captent la même demande.</text><rect x="30.0" y="108" width="302.6666666666667" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Concurrents directs</text><text x="181.33333333333334" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Les hôtels de Longwy et des environs</text><text x="181.33333333333334" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">immédiats. Atout : la proximité. Faiblesse</text><text x="181.33333333333334" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">: un confort limité et peu d’équipements</text><text x="181.33333333333334" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">modernes.</text><rect x="348.6666666666667" y="108" width="302.6666666666667" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Concurrents régionaux</text><text x="500.0" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">B&amp;B Hôtel, HôtelF1, Couleur Framboise,</text><text x="500.0" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">dans les villes proches. Le premier vise</text><text x="500.0" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">le haut de gamme et se paie ; les autres</text><text x="500.0" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">couvrent tous les budgets mais sont</text><text x="500.0" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">excentrés.</text><rect x="667.3333333333334" y="108" width="302.6666666666667" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Plateformes alternatives</text><text x="818.6666666666667" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Airbnb et les locations entre</text><text x="818.6666666666667" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">particuliers. Souples et souvent moins</text><text x="818.6666666666667" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">chères, mais sans accueil permanent ni</text><text x="818.6666666666667" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">ménage quotidien — c’est là que l’hôtel</text><text x="818.6666666666667" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">garde la main.</text></svg>