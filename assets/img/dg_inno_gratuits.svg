<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 379" width="1000" height="379" role="img"><rect width="1000" height="379" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Qualifier l’innovation des journaux gratuits</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">La question centrale du premier cas : de quelle innovation parle-t-on exactement ?</text><rect x="30" y="108" width="940" height="34" rx="6" fill="#123A63"/><text x="42" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Type d’innovation</text><text x="277.0" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Ce qu’elle suppose</text><text x="586.2105263157895" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Le cas des gratuits</text><rect x="30" y="142" width="940" height="35" fill="white"/><line x1="30" y1="142" x2="970" y2="142" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Incrémentale</text><text x="277.0" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Amélioration continue de l’existant</text><text x="586.2105263157895" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Non : le modèle économique change complètement</text><rect x="30" y="177" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="177" x2="970" y2="177" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="197" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Radicale</text><text x="277.0" y="197" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Forte connotation technologique,</text><text x="277.0" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">technologie nouvelle</text><text x="586.2105263157895" y="197" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Non : le produit reste un journal papier</text><rect x="30" y="229" width="940" height="52" fill="white"/><line x1="30" y1="229" x2="970" y2="229" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="249" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">De modèle économique</text><text x="277.0" y="249" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">La façon de créer et de capter la valeur</text><text x="277.0" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">change</text><text x="586.2105263157895" y="249" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui : gratuité pour le lecteur, financement quasi</text><text x="586.2105263157895" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">exclusivement publicitaire</text><rect x="30" y="281" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="281" x2="970" y2="281" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="301" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">D’usage</text><text x="277.0" y="301" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Nouveau moment, nouveau lieu, nouvelle</text><text x="277.0" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">manière de consommer</text><text x="586.2105263157895" y="301" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Oui : lecture rapide, consommation dans les transports</text><rect x="30" y="108" width="940" height="225" rx="6" fill="none" stroke="#DCE5EF" stroke-width="1.5"/><text x="30" y="357" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">C’est l’erreur la plus fréquente : qualifier de « radicale » une innovation qui est en réalité une innovation de modèle économique.</text></svg>