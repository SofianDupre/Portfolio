<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img"><rect width="1000" height="600" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La roue de Deming et les outils de la qualité</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">L’amélioration continue appliquée à la gestion de production.</text><circle cx="500" cy="323" r="118" fill="none" stroke="#DCE5EF" stroke-width="2" stroke-dasharray="6 6"/><circle cx="500" cy="205" r="25" fill="#123A63"/><text x="500.0" y="211.0" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">1</text><text x="500.0" y="110.0" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Planifier</text><text x="500.0" y="133.0" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">Définir le problème, mesurer, fixer</text><text x="500.0" y="149.0" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">l’objectif — QQOQCP.</text><circle cx="618" cy="323" r="25" fill="#123A63"/><text x="618.0" y="329.0" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">2</text><text x="734.0" y="301.5" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Faire</text><text x="734.0" y="324.5" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">Mettre en œuvre la solution sur un</text><text x="734.0" y="340.5" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">périmètre restreint.</text><circle cx="500" cy="441" r="25" fill="#123A63"/><text x="500.0" y="447.0" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">3</text><text x="500.0" y="489.0" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Vérifier</text><text x="500.0" y="512.0" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">Mesurer l’écart entre le résultat</text><text x="500.0" y="528.0" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">obtenu et l’objectif.</text><circle cx="382" cy="323" r="25" fill="#123A63"/><text x="382.0" y="329.0" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">4</text><text x="266.0" y="301.5" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Agir</text><text x="266.0" y="324.5" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">Généraliser ce qui marche, corriger</text><text x="266.0" y="340.5" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">le reste, et recommencer.</text><circle cx="500" cy="323" r="46" fill="#17879E"/><text x="500.0" y="328" font-family="Lato, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">PDCA</text><text x="30" y="578" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Les outils mobilisés à chaque tour : Pareto pour hiérarchiser, Ishikawa pour remonter aux causes, les cinq pourquoi pour ne pas s’arrêter au</text><text x="30" y="594" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">symptôme.</text></svg>