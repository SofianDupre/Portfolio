<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 422" width="1000" height="422" role="img"><rect width="1000" height="422" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">MOBILUX — concepts et objectifs</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Ce que le projet veut produire, et à quoi on saura qu’il y est parvenu.</text><rect x="30.0" y="108" width="302.6666666666667" height="147" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Mobilité transfrontalière</text><text x="181.33333333333334" y="176" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">intelligente</text><text x="181.33333333333334" y="204" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Mettre en relation ceux qui font le même</text><text x="181.33333333333334" y="221" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">trajet, au même moment, vers le même</text><text x="181.33333333333334" y="238" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">bassin d’emploi.</text><rect x="348.6666666666667" y="108" width="302.6666666666667" height="147" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Solution durable</text><text x="500.0" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Remplir des véhicules qui roulent déjà</text><text x="500.0" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">plutôt que d’en ajouter — l’économie de</text><text x="500.0" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">CO₂ vient de là.</text><rect x="667.3333333333334" y="108" width="302.6666666666667" height="147" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Plateforme numérique collaborative</text><text x="818.6666666666667" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Un outil simple, fiable et rapide,</text><text x="818.6666666666667" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">administré par ses utilisateurs eux-mêmes.</text><rect x="30.0" y="271" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="289" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="319" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Solidarité territoriale</text><text x="181.33333333333334" y="347" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Redonner une solution de transport à ceux</text><text x="181.33333333333334" y="364" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">que les communes rurales laissent sans</text><text x="181.33333333333334" y="381" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">alternative.</text><rect x="348.6666666666667" y="271" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="289" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="319" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Fluidité du trafic</text><text x="500.0" y="347" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Alléger l’axe Mont-Saint-Martin –</text><text x="500.0" y="364" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Luxembourg aux heures de pointe.</text><rect x="667.3333333333334" y="271" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="289" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="319" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Réduction de l’empreinte carbone</text><text x="818.6666666666667" y="347" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">L’indicateur qui conditionne l’accès aux</text><text x="818.6666666666667" y="364" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">financements publics et européens.</text></svg>