<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 484" width="1000" height="484" role="img"><rect width="1000" height="484" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La répartition des abonnements payants</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Sur les 4 802 abonnés payants du fichier, la durée choisie détermine directement le chiffre d’affaires récurrent.</text><line x1="30" y1="350" x2="970" y2="350" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="120" width="218" height="230" rx="5" fill="#17879E"/><text x="139.25" y="108.0" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="#123A63" text-anchor="middle">2 425 abonnés</text><text x="139.25" y="386" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">1 an</text><text x="139.25" y="410" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">50,5 % des abonnés payants</text><rect x="270" y="202" width="218" height="148" rx="5" fill="#17879E"/><text x="379.75" y="190.23092783505155" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="#123A63" text-anchor="middle">1 558 abonnés</text><text x="379.75" y="386" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">6 mois</text><text x="379.75" y="410" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">32,4 %</text><rect x="511" y="272" width="218" height="78" rx="5" fill="#17879E"/><text x="620.25" y="260.32164948453607" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="#123A63" text-anchor="middle">819 abonnés</text><text x="620.25" y="386" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">3 mois</text><text x="620.25" y="410" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">17,1 %</text><rect x="752" y="255" width="218" height="95" rx="5" fill="#17879E"/><text x="860.75" y="243.15463917525773" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="#123A63" text-anchor="middle">1 000 abonnés</text><text x="860.75" y="386" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Cours à la carte</text><text x="860.75" y="410" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">achetés en complément</text><text x="30" y="462" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">L’abonnement annuel domine : c’est lui qui sécurise la trésorerie de la première année.</text></svg>