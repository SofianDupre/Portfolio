<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 407" width="1000" height="407" role="img"><rect width="1000" height="407" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Les six fonctions de la banque dans l’économie</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le point de départ du module : à quoi servent les banques ?</text><rect x="30.0" y="108" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Gérer les moyens de paiement</text><text x="181.33333333333334" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">19 milliards d’opérations bancaires</text><text x="181.33333333333334" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">réalisées à partir de la monnaie</text><text x="181.33333333333334" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">scripturale.</text><rect x="348.6666666666667" y="108" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Drainer l’épargne</text><text x="500.0" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Collecter les dépôts à vue et l’épargne</text><text x="500.0" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">pour les réorienter vers le financement.</text><rect x="667.3333333333334" y="108" width="302.6666666666667" height="127" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Accorder des crédits</text><text x="818.6666666666667" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">1 090 milliards d’euros aux particuliers,</text><text x="818.6666666666667" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">900 milliards aux entreprises.</text><rect x="30.0" y="251" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="164" y="269" width="34" height="4" rx="2" fill="#17879E"/><text x="181.33333333333334" y="299" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Sécuriser les transactions</text><text x="181.33333333333334" y="327" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Garantir la fiabilité des échanges et</text><text x="181.33333333333334" y="344" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">prévenir la fraude.</text><rect x="348.6666666666667" y="251" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="483" y="269" width="34" height="4" rx="2" fill="#17879E"/><text x="500.0" y="299" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Assurer l’intermédiation</text><text x="500.0" y="327" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Mettre en relation agents à capacité et à</text><text x="500.0" y="344" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">besoin de financement sur les marchés.</text><rect x="667.3333333333334" y="251" width="302.6666666666667" height="110" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="802" y="269" width="34" height="4" rx="2" fill="#17879E"/><text x="818.6666666666667" y="299" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Conseiller</text><text x="818.6666666666667" y="327" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Accompagner particuliers et entreprises</text><text x="818.6666666666667" y="344" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">dans leurs décisions financières.</text><text x="30" y="385" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">38 000 agences en France, soit 57 pour 100 000 habitants, et 99 % de la population bancarisée — mais seulement 17 % des clients se rendent en</text><text x="30" y="401" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">agence plus d’une fois par mois, contre 62 % dix ans plus tôt.</text></svg>