<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 448" width="1000" height="448" role="img"><rect width="1000" height="448" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La veille concurrentielle</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Emirates, Qatar Airways, Turkish Airlines et les low-cost long-courrier dominent le marché premium. La veille cherche où se</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">loge l’espace disponible.</text><rect x="30" y="108" width="940" height="34" rx="6" fill="#123A63"/><text x="42" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start"></text><text x="218.25" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Ce que les majors ont pour elles</text><text x="600.125" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Là où elles sont vulnérables</text><rect x="30" y="142" width="940" height="52" fill="white"/><line x1="30" y1="142" x2="970" y2="142" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Notoriété</text><text x="218.25" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une reconnaissance internationale et des budgets</text><text x="218.25" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">marketing considérables</text><text x="600.125" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une image parfois datée, associée à un luxe</text><text x="600.125" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">ostentatoire</text><rect x="30" y="194" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="194" x2="970" y2="194" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Réseau</text><text x="218.25" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un maillage mondial et un nombre de destinations sans</text><text x="218.25" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">commune mesure</text><text x="600.125" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une standardisation de l’expérience d’une ligne à</text><text x="600.125" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">l’autre</text><rect x="30" y="246" width="940" height="52" fill="white"/><line x1="30" y1="246" x2="970" y2="246" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Moyens</text><text x="218.25" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Des économies d’échelle et une puissance financière</text><text x="218.25" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">d’investissement</text><text x="600.125" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une lourdeur organisationnelle qui limite la</text><text x="600.125" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">réactivité</text><rect x="30" y="298" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="298" x2="970" y2="298" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Environnement</text><text x="218.25" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Des flottes modernisées et des programmes de</text><text x="218.25" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">compensation</text><text x="600.125" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une communication environnementale perçue comme</text><text x="600.125" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">opportuniste</text><rect x="30" y="350" width="940" height="52" fill="white"/><line x1="30" y1="350" x2="970" y2="350" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="370" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Réputation</text><text x="218.25" y="370" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Des services de communication structurés</text><text x="600.125" y="370" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une forte exposition aux crises amplifiées par les</text><text x="600.125" y="387" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">réseaux sociaux</text><rect x="30" y="108" width="940" height="294" rx="6" fill="none" stroke="#DCE5EF" stroke-width="1.5"/><text x="30" y="426" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">L’opportunité identifiée : se placer à l’intersection du luxe, de la responsabilité environnementale et de la personnalisation avancée — une</text><text x="30" y="442" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">niche qui évite la confrontation sur le volume et sur le prix.</text></svg>