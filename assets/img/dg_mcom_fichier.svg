<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 293" width="1000" height="293" role="img"><rect width="1000" height="293" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La création du fichier de prospection</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le point de départ de toute prospection : disposer d’une base qualifiée. Un fichier incomplet fait perdre plus de temps qu’il</text><text x="30" y="95" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">n’en fait gagner.</text><rect x="30.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="124" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="141.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">L’objectif</text><text x="141.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Disposer d’une base de</text><text x="141.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">prospects qualifiée, et non</text><text x="141.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">d’une liste de noms sur</text><text x="141.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">laquelle on appellera au</text><text x="141.5" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">hasard.</text><rect x="269.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="364" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="380.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Les sources</text><text x="380.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Annuaires professionnels,</text><text x="380.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">LinkedIn, salons, et les bases</text><text x="380.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">internes — anciens clients et</text><text x="380.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">recommandations, les plus</text><text x="380.5" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">rentables.</text><rect x="508.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="602" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="619.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">La qualité</text><text x="619.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Nom, fonction, coordonnées,</text><text x="619.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">secteur d’activité et taille</text><text x="619.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">de l’entreprise. Chaque champ</text><text x="619.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">manquant se paie au moment de</text><text x="619.5" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’appel.</text><rect x="747.0" y="108" width="223.0" height="161" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><rect x="842" y="126" width="34" height="4" rx="2" fill="#17879E"/><text x="858.5" y="156" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">La segmentation</text><text x="858.5" y="184" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Classer par secteur, potentiel</text><text x="858.5" y="201" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">et localisation, pour adapter</text><text x="858.5" y="218" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’approche plutôt que de</text><text x="858.5" y="235" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">servir le même discours à</text><text x="858.5" y="252" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">tous.</text></svg>