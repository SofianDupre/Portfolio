<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 514" width="1000" height="514" role="img"><rect width="1000" height="514" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">L’analyse SWOT d’Aura Airlines</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le diagnostic croisé, tel qu’il figure au rapport.</text><rect x="30.0" y="108" width="461.0" height="189" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="108" width="461" height="30" rx="10" fill="#1E7A4C"/><rect x="30" y="126" width="461" height="12" fill="#1E7A4C"/><text x="46.0" y="129" font-family="Lato, sans-serif" font-size="12.5" font-weight="700" fill="white" text-anchor="start">FORCES</text><circle cx="46" cy="152" r="3" fill="#1E7A4C"/><text x="56.0" y="156" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Positionnement différenciant</text><text x="56.0" y="174" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Clair, tenu, et lisible dès le premier point de contact.</text><circle cx="46" cy="195" r="3" fill="#1E7A4C"/><text x="56.0" y="199" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">ADN environnemental</text><text x="56.0" y="217" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Central dans la proposition de valeur, pas ajouté après coup.</text><circle cx="46" cy="238" r="3" fill="#1E7A4C"/><text x="56.0" y="242" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Agilité organisationnelle</text><text x="56.0" y="260" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Une structure jeune qui décide et corrige vite.</text><rect x="509.0" y="108" width="461.0" height="189" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="509" y="108" width="461" height="30" rx="10" fill="#B3543A"/><rect x="509" y="126" width="461" height="12" fill="#B3543A"/><text x="525.0" y="129" font-family="Lato, sans-serif" font-size="12.5" font-weight="700" fill="white" text-anchor="start">FAIBLESSES</text><circle cx="525" cy="152" r="3" fill="#B3543A"/><text x="535.0" y="156" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Notoriété limitée</text><text x="535.0" y="174" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Une entreprise récente face à des marques installées depuis des</text><text x="535.0" y="190" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">décennies.</text><circle cx="525" cy="211" r="3" fill="#B3543A"/><text x="535.0" y="215" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Réseau restreint</text><text x="535.0" y="233" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Peu de destinations comparé aux majors.</text><circle cx="525" cy="254" r="3" fill="#B3543A"/><text x="535.0" y="258" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Ressources financières</text><text x="535.0" y="276" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Des marges de manœuvre réduites en cas de choc.</text><rect x="30.0" y="315" width="461.0" height="173" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="315" width="461" height="30" rx="10" fill="#17879E"/><rect x="30" y="333" width="461" height="12" fill="#17879E"/><text x="46.0" y="336" font-family="Lato, sans-serif" font-size="12.5" font-weight="700" fill="white" text-anchor="start">OPPORTUNITÉS</text><circle cx="46" cy="359" r="3" fill="#17879E"/><text x="56.0" y="363" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Tourisme responsable</text><text x="56.0" y="381" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Un marché en croissance, porté par la demande.</text><circle cx="46" cy="402" r="3" fill="#17879E"/><text x="56.0" y="406" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Critères RSE des entreprises</text><text x="56.0" y="424" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">De plus en plus décisifs dans le choix des partenaires de voyage.</text><circle cx="46" cy="445" r="3" fill="#17879E"/><text x="56.0" y="449" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Digitalisation du parcours</text><text x="56.0" y="467" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Une attente devenue standard, que les majors servent mal.</text><rect x="509.0" y="315" width="461.0" height="173" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="509" y="315" width="461" height="30" rx="10" fill="#8A6A2F"/><rect x="509" y="333" width="461" height="12" fill="#8A6A2F"/><text x="525.0" y="336" font-family="Lato, sans-serif" font-size="12.5" font-weight="700" fill="white" text-anchor="start">MENACES</text><circle cx="525" cy="359" r="3" fill="#8A6A2F"/><text x="535.0" y="363" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Guerre des prix</text><text x="535.0" y="381" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Les low-cost long-courrier peuvent fragiliser le positionnement.</text><circle cx="525" cy="402" r="3" fill="#8A6A2F"/><text x="535.0" y="406" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Crises sanitaires et géopolitiques</text><text x="535.0" y="424" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Un secteur qui s’arrête du jour au lendemain.</text><circle cx="525" cy="445" r="3" fill="#8A6A2F"/><text x="535.0" y="449" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Prix du carburant</text><text x="535.0" y="467" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Une volatilité qui pèse directement sur la rentabilité.</text></svg>