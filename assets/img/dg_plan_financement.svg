<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 396" width="1000" height="396" role="img"><rect width="1000" height="396" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Le plan d’investissement et de financement</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">L’équilibre à démontrer : chaque euro de besoin doit trouver sa ressource.</text><rect x="30" y="108" width="940" height="34" rx="6" fill="#123A63"/><text x="42" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Besoins durables</text><text x="253.0204081632653" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Contenu</text><text x="512.0" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Ressources durables</text><text x="713.4285714285714" y="130" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="white" text-anchor="start">Contenu</text><rect x="30" y="142" width="940" height="52" fill="white"/><line x1="30" y1="142" x2="970" y2="142" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Immobilisations</text><text x="42" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">incorporelles</text><text x="253.0204081632653" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Logiciels, site, dépôt de marque</text><text x="512.0" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Apports personnels</text><text x="713.4285714285714" y="162" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Capital social et comptes courants</text><text x="713.4285714285714" y="179" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">d’associés</text><rect x="30" y="194" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="194" x2="970" y2="194" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Immobilisations corporelles</text><text x="253.0204081632653" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Matériel, aménagements, véhicules</text><text x="512.0" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Emprunt bancaire</text><text x="713.4285714285714" y="214" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Montant, durée, taux, tableau</text><text x="713.4285714285714" y="231" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">d’amortissement</text><rect x="30" y="246" width="940" height="52" fill="white"/><line x1="30" y1="246" x2="970" y2="246" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Besoin en fonds de roulement</text><text x="253.0204081632653" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Stocks et créances à financer dès</text><text x="253.0204081632653" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">le départ</text><text x="512.0" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Aides et subventions</text><text x="713.4285714285714" y="266" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Dispositifs à la création, prêts</text><text x="713.4285714285714" y="283" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">d’honneur</text><rect x="30" y="298" width="940" height="52" fill="#F4F7FA"/><line x1="30" y1="298" x2="970" y2="298" stroke="#DCE5EF" stroke-width="1"/><text x="42" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="600" fill="#123A63" text-anchor="start">Frais d’établissement</text><text x="253.0204081632653" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Formalités, honoraires,</text><text x="253.0204081632653" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">communication de lancement</text><text x="512.0" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Autres financements</text><text x="713.4285714285714" y="318" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Crédit-bail, financement</text><text x="713.4285714285714" y="335" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">participatif</text><rect x="30" y="108" width="940" height="242" rx="6" fill="none" stroke="#DCE5EF" stroke-width="1.5"/><text x="30" y="374" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Un plan qui s’équilibre à l’euro près mais laisse la trésorerie à zéro n’est pas finançable : c’est le prévisionnel de trésorerie qui</text><text x="30" y="390" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">tranche.</text></svg>