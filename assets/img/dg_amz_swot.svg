<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 638" width="1000" height="638" role="img"><rect width="1000" height="638" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">La matrice SWOT du groupe Amazon</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">La synthèse du diagnostic, construite après l’analyse externe et interne.</text><rect x="30.0" y="108" width="461.0" height="216" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="108" width="461" height="30" rx="10" fill="#1E7A4C"/><rect x="30" y="126" width="461" height="12" fill="#1E7A4C"/><text x="46.0" y="129" font-family="Lato, sans-serif" font-size="12.5" font-weight="700" fill="white" text-anchor="start">FORCES</text><circle cx="46" cy="152" r="3" fill="#1E7A4C"/><text x="56.0" y="156" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Leader mondial du e-commerce</text><text x="56.0" y="174" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Position dominante et large base de clients fidèles.</text><circle cx="46" cy="195" r="3" fill="#1E7A4C"/><text x="56.0" y="199" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Infrastructure logistique avancée</text><text x="56.0" y="217" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Réseau de distribution global et centres de traitement</text><text x="56.0" y="233" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">automatisés.</text><circle cx="46" cy="254" r="3" fill="#1E7A4C"/><text x="56.0" y="258" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Diversification</text><text x="56.0" y="276" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Présence dans le cloud, le streaming, la santé et l’alimentation.</text><circle cx="46" cy="297" r="3" fill="#1E7A4C"/><text x="56.0" y="301" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Innovation continue</text><text x="56.0" y="319" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Investissement soutenu en R&amp;D, en IA et en automatisation.</text><rect x="509.0" y="108" width="461.0" height="216" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="509" y="108" width="461" height="30" rx="10" fill="#B3543A"/><rect x="509" y="126" width="461" height="12" fill="#B3543A"/><text x="525.0" y="129" font-family="Lato, sans-serif" font-size="12.5" font-weight="700" fill="white" text-anchor="start">FAIBLESSES</text><circle cx="525" cy="152" r="3" fill="#B3543A"/><text x="535.0" y="156" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Conditions de travail</text><text x="535.0" y="174" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Critiques récurrentes sur les conditions dans les entrepôts.</text><circle cx="525" cy="195" r="3" fill="#B3543A"/><text x="535.0" y="199" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Concurrence accrue</text><text x="535.0" y="217" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Une pression forte venue d’acteurs très différents.</text><circle cx="525" cy="238" r="3" fill="#B3543A"/><text x="535.0" y="242" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Frais d’exploitation élevés</text><text x="535.0" y="260" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Coûts logistiques, d’infrastructure et de personnel.</text><circle cx="525" cy="281" r="3" fill="#B3543A"/><text x="535.0" y="285" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Fiscalité</text><text x="535.0" y="303" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Critiques sur les pratiques d’optimisation, qui pèsent sur</text><text x="535.0" y="319" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">l’image.</text><rect x="30.0" y="342" width="461.0" height="248" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="342" width="461" height="30" rx="10" fill="#17879E"/><rect x="30" y="360" width="461" height="12" fill="#17879E"/><text x="46.0" y="363" font-family="Lato, sans-serif" font-size="12.5" font-weight="700" fill="white" text-anchor="start">OPPORTUNITÉS</text><circle cx="46" cy="386" r="3" fill="#17879E"/><text x="56.0" y="390" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Marchés émergents</text><text x="56.0" y="408" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Croissance possible en Afrique, en Inde et en Amérique du Sud.</text><circle cx="46" cy="429" r="3" fill="#17879E"/><text x="56.0" y="433" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Santé</text><text x="56.0" y="451" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Développement d’Amazon Pharmacy et d’Amazon Care.</text><circle cx="46" cy="472" r="3" fill="#17879E"/><text x="56.0" y="476" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Technologies émergentes</text><text x="56.0" y="494" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Livraison par drones et automatisation de la chaîne.</text><circle cx="46" cy="515" r="3" fill="#17879E"/><text x="56.0" y="519" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Économie durable</text><text x="56.0" y="537" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Énergies renouvelables et pratiques responsables.</text><rect x="509.0" y="342" width="461.0" height="248" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="509" y="342" width="461" height="30" rx="10" fill="#8A6A2F"/><rect x="509" y="360" width="461" height="12" fill="#8A6A2F"/><text x="525.0" y="363" font-family="Lato, sans-serif" font-size="12.5" font-weight="700" fill="white" text-anchor="start">MENACES</text><circle cx="525" cy="386" r="3" fill="#8A6A2F"/><text x="535.0" y="390" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Réglementations antitrust</text><text x="535.0" y="408" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Régulateurs américains et européens attentifs à la position</text><text x="535.0" y="424" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">dominante.</text><circle cx="525" cy="445" r="3" fill="#8A6A2F"/><text x="535.0" y="449" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Géants concurrents</text><text x="535.0" y="467" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Google, Microsoft avec Azure, Alibaba et Walmart.</text><circle cx="525" cy="488" r="3" fill="#8A6A2F"/><text x="535.0" y="492" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Pressions environnementales</text><text x="535.0" y="510" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Empreinte carbone de la logistique et des livraisons à grande</text><text x="535.0" y="526" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">échelle.</text><circle cx="525" cy="547" r="3" fill="#8A6A2F"/><text x="535.0" y="551" font-family="Lato, sans-serif" font-size="13.5" font-weight="700" fill="#123A63" text-anchor="start">Fluctuations économiques</text><text x="535.0" y="569" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="start">Sensibilité de la consommation aux cycles.</text><text x="30" y="616" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Une matrice ne vaut que par la hiérarchie qu’elle établit : ici, la dépendance aux marges du cloud et le risque réglementaire dominent.</text></svg>