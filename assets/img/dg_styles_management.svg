<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img"><rect width="1000" height="540" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Les quatre styles de management</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Le style se choisit selon l’autonomie et la motivation du collaborateur, pas selon le tempérament du manager.</text><rect x="160" y="112" width="672" height="336" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><line x1="496" y1="112" x2="496" y2="448" stroke="#DCE5EF" stroke-width="1.5"/><line x1="160" y1="280" x2="832" y2="280" stroke="#DCE5EF" stroke-width="1.5"/><text x="496" y="480" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle">Autonomie du collaborateur</text><text x="114" y="280" font-family="Lato, sans-serif" font-size="13.5" font-weight="600" fill="#123A63" text-anchor="middle" transform="rotate(-90 114 280)">Implication du manager</text><text x="328.0" y="182.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Directif</text><text x="328.0" y="208.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le manager décide et prescrit. Utile face à</text><text x="328.0" y="225.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’urgence ou à un collaborateur débutant.</text><text x="664.0" y="182.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Persuasif</text><text x="664.0" y="208.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le manager décide mais explique et convainc.</text><text x="664.0" y="225.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Il mobilise autant qu’il dirige.</text><text x="664.0" y="350.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Délégatif</text><text x="664.0" y="376.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le manager confie l’objectif et les moyens.</text><text x="664.0" y="393.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Il reste garant du résultat.</text><text x="328.0" y="350.0" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Participatif</text><text x="328.0" y="376.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Le manager décide avec l’équipe. Il</text><text x="328.0" y="393.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">construit l’adhésion plutôt que</text><text x="328.0" y="410.0" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’obéissance.</text><text x="30" y="518" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Les cinq dimensions qui inspirent la confiance : l’intérêt porté, la crédibilité, l’écoute, la transparence et la fiabilité des engagements</text><text x="30" y="534" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">tenus.</text></svg>