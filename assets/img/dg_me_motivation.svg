<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 437" width="1000" height="437" role="img"><rect width="1000" height="437" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Les trois théories de la motivation</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Ce qui fait qu’un collaborateur s’engage — ou décroche. Trois modèles, complémentaires plutôt que concurrents.</text><rect x="30.0" y="108" width="302.6666666666667" height="283" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="30" y="108" width="303" height="28" rx="10" fill="#123A63"/><rect x="30" y="124" width="303" height="12" fill="#123A63"/><text x="45.0" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">MASLOW — LA PYRAMIDE</text><circle cx="46" cy="152" r="2.5" fill="#17879E"/><text x="57.0" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Physiologique : le salaire de base</text><circle cx="46" cy="178" r="2.5" fill="#17879E"/><text x="57.0" y="182" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Sécurité : le contrat stable, la</text><text x="57.0" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">protection sociale</text><circle cx="46" cy="221" r="2.5" fill="#17879E"/><text x="57.0" y="225" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Appartenance : l’ambiance d’équipe</text><circle cx="46" cy="247" r="2.5" fill="#17879E"/><text x="57.0" y="251" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Estime : les félicitations, la</text><text x="57.0" y="268" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">reconnaissance</text><circle cx="46" cy="290" r="2.5" fill="#17879E"/><text x="57.0" y="294" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Accomplissement : l’évolution, la</text><text x="57.0" y="311" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">créativité, les projets ambitieux</text><rect x="348.6666666666667" y="108" width="302.6666666666667" height="283" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="349" y="108" width="303" height="28" rx="10" fill="#123A63"/><rect x="349" y="124" width="303" height="12" fill="#123A63"/><text x="363.6666666666667" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">HERZBERG — LES DEUX FACTEURS</text><circle cx="365" cy="152" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Facteurs d’hygiène : salaire,</text><text x="375.6666666666667" y="173" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">conditions de travail, sécurité de</text><text x="375.6666666666667" y="190" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">l’emploi, politique d’entreprise,</text><text x="375.6666666666667" y="207" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">statut, relations</text><circle cx="365" cy="229" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="233" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Leur absence démotive, leur présence ne</text><text x="375.6666666666667" y="250" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">motive pas</text><circle cx="365" cy="272" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="276" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Facteurs de motivation :</text><text x="375.6666666666667" y="293" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">accomplissement, reconnaissance,</text><text x="375.6666666666667" y="310" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">responsabilités, progression, promotion</text><circle cx="365" cy="332" r="2.5" fill="#17879E"/><text x="375.6666666666667" y="336" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Ce sont les seuls qui engagent</text><text x="375.6666666666667" y="353" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">réellement</text><rect x="667.3333333333334" y="108" width="302.6666666666667" height="283" rx="10" fill="white" stroke="#DCE5EF" stroke-width="1.5"/><rect x="667" y="108" width="303" height="28" rx="10" fill="#123A63"/><rect x="667" y="124" width="303" height="12" fill="#123A63"/><text x="682.3333333333334" y="127" font-family="Lato, sans-serif" font-size="11.5" font-weight="700" fill="white" text-anchor="start">VROOM — LE MODÈLE V.I.E.</text><circle cx="683" cy="152" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="156" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Expectation : suis-je capable de</text><text x="694.3333333333334" y="173" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">réussir ce travail ?</text><circle cx="683" cy="195" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="199" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Instrumentalité : qu’est-ce que</text><text x="694.3333333333334" y="216" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">j’obtiens en échange ?</text><circle cx="683" cy="238" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="242" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Valence : la récompense vaut-elle</text><text x="694.3333333333334" y="259" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">l’effort fourni ?</text><circle cx="683" cy="281" r="2.5" fill="#17879E"/><text x="694.3333333333334" y="285" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Si l’une des trois tombe à zéro, la</text><text x="694.3333333333334" y="302" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">motivation tombe avec elle</text><text x="30" y="415" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Le test que propose le cours : travailleriez-vous dur pour un examen qui compte pour 2 % de la note finale ?</text></svg>