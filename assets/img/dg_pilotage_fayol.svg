<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 577" width="1000" height="577" role="img"><rect width="1000" height="577" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Les cinq fonctions de Fayol, appliquées au pilotage</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Henri Fayol, Administration industrielle et générale, 1916 — la colonne vertébrale du cours que j’ai conçu et animé.</text><circle cx="500" cy="323" r="118" fill="none" stroke="#DCE5EF" stroke-width="2" stroke-dasharray="6 6"/><circle cx="500" cy="205" r="25" fill="#123A63"/><text x="500.0" y="211.0" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">1</text><text x="500.0" y="110.0" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Prévoir</text><text x="500.0" y="133.0" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">Anticiper l’avenir et planifier</text><text x="500.0" y="149.0" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">l’action.</text><circle cx="612" cy="287" r="25" fill="#123A63"/><text x="612.2246689228281" y="292.5359946637562" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">2</text><text x="722.5472248130659" y="191.53599466375618" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Organiser</text><text x="722.5472248130659" y="214.53599466375618" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">Répartir les ressources et définir</text><text x="722.5472248130659" y="230.53599466375618" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">les responsabilités.</text><circle cx="569" cy="418" r="25" fill="#123A63"/><text x="569.3586597705118" y="424.4640053362438" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">3</text><text x="637.5417490364387" y="466.4640053362438" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Commander</text><text x="637.5417490364387" y="489.4640053362438" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">Diriger et impulser l’action</text><text x="637.5417490364387" y="505.4640053362438" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">collective.</text><circle cx="431" cy="418" r="25" fill="#123A63"/><text x="430.64134022948815" y="424.4640053362438" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">4</text><text x="362.45825096356134" y="466.4640053362438" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Coordonner</text><text x="362.45825096356134" y="489.4640053362438" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">Harmoniser les efforts pour éviter</text><text x="362.45825096356134" y="505.4640053362438" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">les incohérences.</text><circle cx="388" cy="287" r="25" fill="#123A63"/><text x="387.77533107717187" y="292.53599466375624" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">5</text><text x="277.45277518693405" y="191.53599466375624" font-family="Lato, sans-serif" font-size="14" font-weight="600" fill="#123A63" text-anchor="middle">Contrôler</text><text x="277.45277518693405" y="214.53599466375624" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">Vérifier les résultats et corriger</text><text x="277.45277518693405" y="230.53599466375624" font-family="Lato, sans-serif" font-size="12" font-weight="400" fill="#56687D" text-anchor="middle">les écarts.</text><circle cx="500" cy="323" r="46" fill="#17879E"/><text x="500.0" y="323" font-family="Lato, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">FAYOL 1916</text><text x="30" y="555" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">La problématique traitée : comment un manager peut-il piloter efficacement une activité tout en mobilisant durablement ses équipes ?</text></svg>